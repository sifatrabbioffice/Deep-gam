              SWIFT_VERSION: "5.9"
              DEVELOPMENT_TEAM: ""
              PRODUCT_BUNDLE_IDENTIFIER: com.infinityrun3d.game
              TARGETED_DEVICE_FAMILY: "1"
              IPHONEOS_DEPLOYMENT_TARGET: "16.0"
              CODE_SIGN_IDENTITY: ""
              CODE_SIGNING_REQUIRED: "NO"
              CODE_SIGNING_ALLOWED: "NO"
