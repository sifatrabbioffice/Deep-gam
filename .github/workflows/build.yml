name: 🚀 Infinite Road Runner – AAA iOS Game

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-14
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Install Tools
        run: |
          brew install xcodegen
          gem install xcpretty --no-document 2>/dev/null || true

      - name: Create Directories
        run: |
          mkdir -p InfiniteRoad/Sources
          mkdir -p InfiniteRoad/Resources/Assets.xcassets/AppIcon.appiconset
          mkdir -p InfiniteRoad/Resources/Sounds

      # ── AppDelegate ──────────────────────────────────────────────────────────
      - name: AppDelegate.swift
        run: |
          cat > InfiniteRoad/Sources/AppDelegate.swift << 'SWIFT_EOF'
          import UIKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(
                  _ application: UIApplication,
                  didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?
              ) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  window?.rootViewController = MainMenuViewController()
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          SWIFT_EOF

      # ── Types ────────────────────────────────────────────────────────────────
      - name: Types.swift
        run: |
          cat > InfiniteRoad/Sources/Types.swift << 'SWIFT_EOF'
          import Foundation

          enum ObstacleType: CaseIterable {
              case lowBarrier, tallBarrier, rock
              var height: Float {
                  switch self {
                  case .lowBarrier: return 1.0
                  case .tallBarrier: return 2.5
                  case .rock: return 1.5
                  }
              }
              var width: Float { return 1.2 }
              var scorePenalty: Int { return 200 }
          }

          enum CharacterSkin: String, CaseIterable {
              case defaultMan = "Default"
              case ninja      = "Ninja"
              case robot      = "Robot"

              var torsoColor: UIColor {
                  switch self {
                  case .defaultMan: return UIColor(red: 0.15, green: 0.25, blue: 0.45, alpha: 1)
                  case .ninja:      return UIColor(red: 0.05, green: 0.05, blue: 0.05, alpha: 1)
                  case .robot:      return UIColor(red: 0.55, green: 0.55, blue: 0.60, alpha: 1)
                  }
              }
              var headColor: UIColor {
                  switch self {
                  case .defaultMan: return UIColor(red: 0.92, green: 0.76, blue: 0.65, alpha: 1)
                  case .ninja:      return UIColor(red: 0.80, green: 0.70, blue: 0.60, alpha: 1)
                  case .robot:      return UIColor(red: 0.70, green: 0.70, blue: 0.75, alpha: 1)
                  }
              }
              var pantsColor: UIColor {
                  switch self {
                  case .defaultMan: return UIColor(red: 0.10, green: 0.12, blue: 0.18, alpha: 1)
                  case .ninja:      return UIColor(red: 0.08, green: 0.08, blue: 0.10, alpha: 1)
                  case .robot:      return UIColor(red: 0.30, green: 0.30, blue: 0.35, alpha: 1)
                  }
              }
          }

          extension UserDefaults {
              private enum Keys {
                  static let selectedSkin = "selected_skin"
                  static let soundVolume = "sound_volume"
              }
              var selectedSkin: CharacterSkin {
                  get {
                      guard let raw = string(forKey: Keys.selectedSkin),
                            let skin = CharacterSkin(rawValue: raw) else { return .defaultMan }
                      return skin
                  }
                  set { set(newValue.rawValue, forKey: Keys.selectedSkin) }
              }
              var soundVolume: Float {
                  get { return float(forKey: Keys.soundVolume) != 0 ? float(forKey: Keys.soundVolume) : 0.7 }
                  set { set(newValue, forKey: Keys.soundVolume) }
              }
          }
          SWIFT_EOF

      # ── AudioManager ─────────────────────────────────────────────────────────
      - name: AudioManager.swift
        run: |
          cat > InfiniteRoad/Sources/AudioManager.swift << 'SWIFT_EOF'
          import AVFoundation

          class AudioManager {
              static let shared = AudioManager()
              private var players: [String: AVAudioPlayer] = [:]
              private var bgmPlayer: AVAudioPlayer?

              func preloadSounds() {
                  let sounds = ["coin", "jump", "hit", "bgm"]
                  for name in sounds {
                      guard let url = Bundle.main.url(forResource: name, withExtension: "wav") else { continue }
                      do {
                          let player = try AVAudioPlayer(contentsOf: url)
                          player.prepareToPlay()
                          if name == "bgm" {
                              player.numberOfLoops = -1
                              player.volume = UserDefaults.standard.soundVolume
                              bgmPlayer = player
                          } else {
                              players[name] = player
                          }
                      } catch {
                          print("Audio load error: \(error)")
                      }
                  }
                  bgmPlayer?.play()
              }

              func play(_ sound: String) {
                  guard let player = players[sound] else { return }
                  player.volume = UserDefaults.standard.soundVolume
                  player.currentTime = 0
                  player.play()
              }

              func updateVolume(_ vol: Float) {
                  bgmPlayer?.volume = vol
                  for (_, player) in players { player.volume = vol }
              }

              func stopBGM() { bgmPlayer?.stop() }
          }
          SWIFT_EOF

      # ── JoystickView (adapted for runner) ────────────────────────────────────
      - name: JoystickView.swift
        run: |
          cat > InfiniteRoad/Sources/JoystickView.swift << 'SWIFT_EOF'
          import UIKit

          class JoystickView: UIView {
              private let ring = UIView()
              private let knob = UIView()
              let radius: CGFloat
              var velocity: SIMD2<Float> = .zero   // x: horizontal, y: vertical
              var isActive: Bool = false
              var jumpTriggered: Bool = false
              weak var trackingTouch: UITouch?

              init(radius: CGFloat) {
                  self.radius = radius
                  super.init(frame: CGRect(x: 0, y: 0, width: radius * 2, height: radius * 2))
                  isUserInteractionEnabled = false
                  alpha = 0.78

                  ring.frame               = bounds
                  ring.layer.cornerRadius  = radius
                  ring.backgroundColor     = UIColor(white: 1, alpha: 0.07)
                  ring.layer.borderColor   = UIColor(white: 1, alpha: 0.26).cgColor
                  ring.layer.borderWidth   = 2
                  addSubview(ring)

                  let kR                   = radius * 0.38
                  knob.frame               = CGRect(x: radius - kR, y: radius - kR, width: kR * 2, height: kR * 2)
                  knob.layer.cornerRadius  = kR
                  knob.backgroundColor     = UIColor(white: 1, alpha: 0.32)
                  knob.layer.borderColor   = UIColor(white: 1, alpha: 0.5).cgColor
                  knob.layer.borderWidth   = 1.5
                  addSubview(knob)
              }
              required init?(coder: NSCoder) { fatalError() }

              func moveTouch(_ touch: UITouch, in parentView: UIView) {
                  let pt   = touch.location(in: parentView)
                  let cx   = frame.midX, cy = frame.midY
                  let dx   = Float(pt.x - cx), dy = Float(pt.y - cy)
                  let dist = sqrt(dx * dx + dy * dy)
                  let maxD = Float(radius)
                  let f    = dist <= maxD ? 1.0 : maxD / dist
                  knob.center = CGPoint(x: cx + CGFloat(dx * f), y: cy + CGFloat(dy * f))
                  velocity    = SIMD2<Float>(dx * f / maxD, dy * f / maxD)
                  isActive    = dist > maxD * 0.12
                  jumpTriggered = (dy < -0.6 * maxD)  // push up beyond threshold triggers jump
              }

              func reset() {
                  knob.center   = CGPoint(x: radius, y: radius)
                  velocity      = .zero
                  isActive      = false
                  jumpTriggered = false
                  trackingTouch = nil
              }
          }
          SWIFT_EOF

      # ── CharacterNode ────────────────────────────────────────────────────────
      - name: CharacterNode.swift
        run: |
          cat > InfiniteRoad/Sources/CharacterNode.swift << 'SWIFT_EOF'
          import SceneKit

          class CharacterNode: SCNNode {
              private var bodyNode: SCNNode!
              private var leftLeg: SCNNode!
              private var rightLeg: SCNNode!
              private var leftArm: SCNNode!
              private var rightArm: SCNNode!
              private var animationTime: Float = 0
              private var isJumping: Bool = false
              private var jumpProgress: Float = 0
              private var skin: CharacterSkin = .defaultMan

              init(skin: CharacterSkin) {
                  self.skin = skin
                  super.init()
                  buildCharacter()
              }
              required init?(coder: NSCoder) { fatalError() }

              private func buildCharacter() {
                  bodyNode = SCNNode()
                  addChildNode(bodyNode)

                  let torsoGeo = SCNBox(width: 0.55, height: 0.75, length: 0.35, chamferRadius: 0.08)
                  torsoGeo.materials = [material(color: skin.torsoColor)]
                  let torso = SCNNode(geometry: torsoGeo)
                  torso.position = SCNVector3(0, 0.3, 0)
                  bodyNode.addChildNode(torso)

                  let headGeo = SCNSphere(radius: 0.18)
                  headGeo.materials = [material(color: skin.headColor)]
                  let head = SCNNode(geometry: headGeo)
                  head.position = SCNVector3(0, 0.78, 0)
                  bodyNode.addChildNode(head)

                  let legGeo = SCNCylinder(radius: 0.10, height: 0.65)
                  legGeo.materials = [material(color: skin.pantsColor)]
                  leftLeg = SCNNode(geometry: legGeo)
                  leftLeg.pivot = SCNMatrix4MakeTranslation(0, 0.325, 0)
                  leftLeg.position = SCNVector3(-0.16, 0, 0)
                  bodyNode.addChildNode(leftLeg)

                  rightLeg = SCNNode(geometry: legGeo)
                  rightLeg.pivot = SCNMatrix4MakeTranslation(0, 0.325, 0)
                  rightLeg.position = SCNVector3(0.16, 0, 0)
                  bodyNode.addChildNode(rightLeg)

                  let armGeo = SCNCylinder(radius: 0.08, height: 0.60)
                  armGeo.materials = [material(color: skin.torsoColor)]
                  leftArm = SCNNode(geometry: armGeo)
                  leftArm.pivot = SCNMatrix4MakeTranslation(0, 0.30, 0)
                  leftArm.position = SCNVector3(-0.36, 0.45, 0)
                  bodyNode.addChildNode(leftArm)

                  rightArm = SCNNode(geometry: armGeo)
                  rightArm.pivot = SCNMatrix4MakeTranslation(0, 0.30, 0)
                  rightArm.position = SCNVector3(0.36, 0.45, 0)
                  bodyNode.addChildNode(rightArm)

                  position = SCNVector3(0, 0, 0)
              }

              private func material(color: UIColor) -> SCNMaterial {
                  let m = SCNMaterial()
                  m.diffuse.contents = color
                  m.lightingModel = .lambert
                  return m
              }

              func updateAnimation(dt: Float, speed: Float, isGrounded: Bool) {
                  if !isGrounded {
                      // jump pose
                      leftLeg.eulerAngles.x = 0
                      rightLeg.eulerAngles.x = 0
                      leftArm.eulerAngles.x = -1.2
                      rightArm.eulerAngles.x = 1.2
                      animationTime = 0
                      return
                  }
                  if speed > 0.1 {
                      animationTime += dt * speed * 8.0
                      let angle = sin(animationTime) * 0.45
                      leftLeg.eulerAngles.x = angle
                      rightLeg.eulerAngles.x = -angle
                      leftArm.eulerAngles.x = -angle * 0.6
                      rightArm.eulerAngles.x = angle * 0.6
                  } else {
                      leftLeg.eulerAngles.x = 0
                      rightLeg.eulerAngles.x = 0
                      leftArm.eulerAngles.x = 0
                      rightArm.eulerAngles.x = 0
                      animationTime = 0
                  }
              }

              func updateJumpAnimation(progress: Float) {
                  // progress 0..1, peak at 0.5
                  let lift: Float = sin(progress * .pi) * 1.5
                  position.y = lift
                  if progress < 0.5 {
                      leftArm.eulerAngles.x = -1.5
                      rightArm.eulerAngles.x = 1.5
                  } else {
                      leftArm.eulerAngles.x = -0.3
                      rightArm.eulerAngles.x = 0.3
                  }
              }
          }
          SWIFT_EOF

      # ── RoadManager ──────────────────────────────────────────────────────────
      - name: RoadManager.swift
        run: |
          cat > InfiniteRoad/Sources/RoadManager.swift << 'SWIFT_EOF'
          import SceneKit

          class RoadManager {
              private weak var scene: SCNScene?
              private let segmentLength: Float = 20
              private let lanes: Int = 3
              private let laneWidth: Float = 3.0
              private var activeSegments: [SCNNode] = []
              private var nextZ: Float = 0
              private var furthestZ: Float = 0

              init(scene: SCNScene) {
                  self.scene = scene
                  buildInitialSegments()
              }

              private func buildInitialSegments() {
                  for i in -2...5 { addSegment(at: Float(i) * segmentLength) }
              }

              private func addSegment(at z: Float) {
                  guard let scene = scene else { return }
                  let roadGeo = SCNBox(width: CGFloat(laneWidth * Float(lanes)), height: 0.1, length: CGFloat(segmentLength), chamferRadius: 0)
                  let mat = SCNMaterial()
                  mat.diffuse.contents = UIColor(red: 0.15, green: 0.15, blue: 0.15, alpha: 1)
                  mat.lightingModel = .lambert
                  roadGeo.materials = [mat]
                  let road = SCNNode(geometry: roadGeo)
                  road.position = SCNVector3(0, 0, z + segmentLength/2)
                  scene.rootNode.addChildNode(road)
                  activeSegments.append(road)

                  // lane markers
                  for lane in -1...1 {
                      if lane == 0 { continue }
                      let lineGeo = SCNBox(width: 0.1, height: 0.05, length: CGFloat(segmentLength), chamferRadius: 0)
                      let lineMat = SCNMaterial()
                      lineMat.diffuse.contents = UIColor.white
                      lineGeo.materials = [lineMat]
                      let line = SCNNode(geometry: lineGeo)
                      line.position = SCNVector3(Float(lane) * laneWidth, 0.08, z + segmentLength/2)
                      scene.rootNode.addChildNode(line)
                      activeSegments.append(line)  // track for removal
                  }

                  furthestZ = z + segmentLength
              }

              func update(playerZ: Float) {
                  // recycle segments: if the player has moved past a segment, remove it and add new ahead
                  let threshold = playerZ - segmentLength * 2
                  while let first = activeSegments.first, first.position.z < threshold {
                      first.removeFromParentNode()
                      activeSegments.removeFirst()
                  }
                  while furthestZ - playerZ < segmentLength * 5 {
                      addSegment(at: furthestZ)
                  }
              }
          }
          SWIFT_EOF

      # ── HUD ──────────────────────────────────────────────────────────────────
      - name: HUD.swift
        run: |
          cat > InfiniteRoad/Sources/HUD.swift << 'SWIFT_EOF'
          import UIKit

          class GameHUD: UIView {
              private let scoreLabel = UILabel()
              private let coinLabel  = UILabel()

              override init(frame: CGRect) {
                  super.init(frame: frame)
                  isUserInteractionEnabled = false
                  backgroundColor = .clear

                  coinLabel.frame = CGRect(x: 20, y: 20, width: 200, height: 30)
                  coinLabel.textColor = UIColor(red: 1, green: 0.85, blue: 0.2, alpha: 1)
                  coinLabel.font = UIFont(name: "Courier-Bold", size: 22) ?? UIFont.boldSystemFont(ofSize: 22)
                  addSubview(coinLabel)

                  scoreLabel.frame = CGRect(x: 0, y: 20, width: bounds.width - 20, height: 30)
                  scoreLabel.autoresizingMask = [.flexibleWidth]
                  scoreLabel.textAlignment = .right
                  scoreLabel.textColor = .white
                  scoreLabel.font = UIFont(name: "Courier-Bold", size: 22) ?? UIFont.boldSystemFont(ofSize: 22)
                  addSubview(scoreLabel)
              }
              required init?(coder: NSCoder) { fatalError() }

              func update(coins: Int, score: Int) {
                  coinLabel.text = "🪙 \(coins)"
                  scoreLabel.text = "SCORE: \(score)"
              }
          }
          SWIFT_EOF

      # ── MainMenuViewController ───────────────────────────────────────────────
      - name: MainMenuViewController.swift
        run: |
          cat > InfiniteRoad/Sources/MainMenuViewController.swift << 'SWIFT_EOF'
          import UIKit
          import SceneKit

          class MainMenuViewController: UIViewController {
              private var scnView: SCNView!

              override func viewDidLoad() {
                  super.viewDidLoad()

                  // Background 3D scene
                  scnView = SCNView(frame: view.bounds)
                  scnView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  view.addSubview(scnView)

                  let scene = SCNScene()
                  scene.background.contents = UIColor(red: 0.1, green: 0.1, blue: 0.2, alpha: 1)
                  scnView.scene = scene

                  let camNode = SCNNode()
                  camNode.camera = SCNCamera()
                  camNode.position = SCNVector3(0, 2, 6)
                  camNode.eulerAngles = SCNVector3(-0.2, 0, 0)
                  scene.rootNode.addChildNode(camNode)

                  let light = SCNNode()
                  light.light = SCNLight()
                  light.light?.type = .omni
                  light.position = SCNVector3(0, 5, 5)
                  scene.rootNode.addChildNode(light)

                  let charNode = CharacterNode(skin: UserDefaults.standard.selectedSkin)
                  charNode.position = SCNVector3(0, 0, 0)
                  scene.rootNode.addChildNode(charNode)
                  charNode.runAction(SCNAction.repeatForever(SCNAction.rotateBy(x: 0, y: .pi * 2, z: 0, duration: 8)))

                  // UI Buttons
                  let startBtn = createButton(title: "▶ START", y: view.bounds.height * 0.55)
                  startBtn.addTarget(self, action: #selector(startGame), for: .touchUpInside)
                  view.addSubview(startBtn)

                  let settingsBtn = createButton(title: "⚙ SETTINGS", y: view.bounds.height * 0.68)
                  settingsBtn.addTarget(self, action: #selector(openSettings), for: .touchUpInside)
                  view.addSubview(settingsBtn)

                  AudioManager.shared.preloadSounds()
              }

              private func createButton(title: String, y: CGFloat) -> UIButton {
                  let w: CGFloat = 220, h: CGFloat = 50
                  let btn = UIButton(frame: CGRect(x: (view.bounds.width - w)/2, y: y, width: w, height: h))
                  btn.setTitle(title, for: .normal)
                  btn.titleLabel?.font = UIFont(name: "Courier-Bold", size: 22) ?? UIFont.boldSystemFont(ofSize: 22)
                  btn.backgroundColor = UIColor(red: 0.6, green: 0, blue: 0, alpha: 0.85)
                  btn.layer.cornerRadius = 12
                  btn.layer.borderColor = UIColor(red: 0.9, green: 0.2, blue: 0.2, alpha: 1).cgColor
                  btn.layer.borderWidth = 2
                  return btn
              }

              @objc private func startGame() {
                  let gameVC = GameViewController()
                  gameVC.modalPresentationStyle = .fullScreen
                  present(gameVC, animated: true)
              }

              @objc private func openSettings() {
                  let settingsVC = SettingsViewController()
                  settingsVC.modalPresentationStyle = .fullScreen
                  present(settingsVC, animated: true)
              }

              override var prefersStatusBarHidden: Bool { true }
          }
          SWIFT_EOF

      # ── SettingsViewController ───────────────────────────────────────────────
      - name: SettingsViewController.swift
        run: |
          cat > InfiniteRoad/Sources/SettingsViewController.swift << 'SWIFT_EOF'
          import UIKit
          import SceneKit

          class SettingsViewController: UIViewController {
              private var previewView: SCNView!
              private var charNode: CharacterNode!
              private let segmentControl = UISegmentedControl(items: CharacterSkin.allCases.map { $0.rawValue })
              private let volumeSlider = UISlider()

              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = UIColor(red: 0.05, green: 0.05, blue: 0.1, alpha: 1)

                  // 3D Preview
                  previewView = SCNView(frame: CGRect(x: 0, y: 80, width: view.bounds.width, height: 250))
                  previewView.backgroundColor = .clear
                  view.addSubview(previewView)

                  let scene = SCNScene()
                  scene.background.contents = UIColor.clear
                  previewView.scene = scene
                  previewView.autoenablesDefaultLighting = true
                  previewView.allowsCameraControl = true

                  let cam = SCNNode()
                  cam.camera = SCNCamera()
                  cam.position = SCNVector3(0, 1.5, 3)
                  scene.rootNode.addChildNode(cam)

                  charNode = CharacterNode(skin: UserDefaults.standard.selectedSkin)
                  charNode.position = SCNVector3(0, 0, 0)
                  scene.rootNode.addChildNode(charNode)

                  // Character selector
                  segmentControl.frame = CGRect(x: 30, y: 350, width: view.bounds.width - 60, height: 40)
                  segmentControl.selectedSegmentIndex = CharacterSkin.allCases.firstIndex(of: UserDefaults.standard.selectedSkin) ?? 0
                  segmentControl.addTarget(self, action: #selector(skinChanged), for: .valueChanged)
                  view.addSubview(segmentControl)

                  // Volume
                  let volLabel = UILabel(frame: CGRect(x: 30, y: 420, width: 200, height: 30))
                  volLabel.text = "🔊 Volume"
                  volLabel.textColor = .white
                  volLabel.font = UIFont.systemFont(ofSize: 18, weight: .bold)
                  view.addSubview(volLabel)

                  volumeSlider.frame = CGRect(x: 30, y: 450, width: view.bounds.width - 60, height: 30)
                  volumeSlider.minimumValue = 0
                  volumeSlider.maximumValue = 1
                  volumeSlider.value = UserDefaults.standard.soundVolume
                  volumeSlider.addTarget(self, action: #selector(volumeChanged), for: .valueChanged)
                  view.addSubview(volumeSlider)

                  // Back button
                  let backBtn = UIButton(type: .system)
                  backBtn.frame = CGRect(x: 30, y: 520, width: 120, height: 44)
                  backBtn.setTitle("← BACK", for: .normal)
                  backBtn.titleLabel?.font = UIFont.boldSystemFont(ofSize: 18)
                  backBtn.setTitleColor(.white, for: .normal)
                  backBtn.backgroundColor = UIColor(red: 0.3, green: 0.3, blue: 0.3, alpha: 0.7)
                  backBtn.layer.cornerRadius = 8
                  backBtn.addTarget(self, action: #selector(goBack), for: .touchUpInside)
                  view.addSubview(backBtn)
              }

              @objc private func skinChanged() {
                  let newSkin = CharacterSkin.allCases[segmentControl.selectedSegmentIndex]
                  UserDefaults.standard.selectedSkin = newSkin
                  // replace character
                  charNode.removeFromParentNode()
                  charNode = CharacterNode(skin: newSkin)
                  charNode.position = SCNVector3(0, 0, 0)
                  previewView.scene?.rootNode.addChildNode(charNode)
              }

              @objc private func volumeChanged() {
                  let vol = volumeSlider.value
                  UserDefaults.standard.soundVolume = vol
                  AudioManager.shared.updateVolume(vol)
              }

              @objc private func goBack() {
                  dismiss(animated: true)
              }

              override var prefersStatusBarHidden: Bool { true }
          }
          SWIFT_EOF

      # ── GameViewController (Core Gameplay) ──────────────────────────────────
      - name: GameViewController.swift
        run: |
          cat > InfiniteRoad/Sources/GameViewController.swift << 'SWIFT_EOF'
          import UIKit
          import SceneKit

          class GameViewController: UIViewController, SCNSceneRendererDelegate {
              private var scnView: SCNView!
              private var scene: SCNScene!
              private var player: CharacterNode!
              private var cameraNode: SCNNode!
              private var roadManager: RoadManager!
              private var joystick: JoystickView!
              private var hud: GameHUD!

              // State
              private var playerX: Float = 0
              private var playerZ: Float = 0
              private var speed: Float = 5.0
              private var coins: Int = 0
              private var score: Int = 0
              private var isJumping = false
              private var jumpTimer: Float = 0
              private let jumpDuration: Float = 0.8
              private var isGameOver = false
              private var lastTime: TimeInterval = 0

              private var obstacles: [SCNNode] = []
              private var coinNodes: [SCNNode] = []
              private var spawnTimer: Float = 0
              private let spawnInterval: Float = 2.0

              override func viewDidLoad() {
                  super.viewDidLoad()
                  setupScene()
                  setupPlayer()
                  setupCamera()
                  roadManager = RoadManager(scene: scene)
                  setupJoystick()
                  setupHUD()
                  scene.physicsWorld.contactDelegate = self
                  scnView.delegate = self
                  scnView.isPlaying = true
              }

              private func setupScene() {
                  scnView = SCNView(frame: view.bounds)
                  scnView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  scnView.backgroundColor = UIColor(red: 0.1, green: 0.1, blue: 0.2, alpha: 1)
                  scnView.antialiasingMode = .multisampling4X
                  view.addSubview(scnView)

                  scene = SCNScene()
                  scene.background.contents = UIColor(red: 0.05, green: 0.05, blue: 0.15, alpha: 1)
                  scnView.scene = scene
              }

              private func setupPlayer() {
                  let skin = UserDefaults.standard.selectedSkin
                  player = CharacterNode(skin: skin)
                  player.position = SCNVector3(0, 0, 0)
                  scene.rootNode.addChildNode(player)
              }

              private func setupCamera() {
                  cameraNode = SCNNode()
                  cameraNode.camera = SCNCamera()
                  cameraNode.camera?.fieldOfView = 75
                  cameraNode.position = SCNVector3(0, 2.5, 5)
                  cameraNode.eulerAngles = SCNVector3(-0.15, 0, 0)
                  scene.rootNode.addChildNode(cameraNode)
              }

              private func setupJoystick() {
                  let jR = view.bounds.height * 0.15
                  joystick = JoystickView(radius: jR)
                  joystick.center = CGPoint(x: jR + 30, y: view.bounds.height - jR - 30)
                  view.addSubview(joystick)
              }

              private func setupHUD() {
                  hud = GameHUD(frame: view.bounds)
                  view.addSubview(hud)
              }

              // Touch handling
              override func touchesBegan(_ touches: Set<UITouch>, with event: UIEvent?) {
                  for t in touches {
                      let pt = t.location(in: view)
                      if joystick.frame.contains(pt) && joystick.trackingTouch == nil {
                          joystick.trackingTouch = t
                      }
                  }
              }
              override func touchesMoved(_ touches: Set<UITouch>, with event: UIEvent?) {
                  for t in touches {
                      if t === joystick.trackingTouch {
                          joystick.moveTouch(t, in: view)
                      }
                  }
              }
              override func touchesEnded(_ touches: Set<UITouch>, with event: UIEvent?) {
                  for t in touches {
                      if t === joystick.trackingTouch { joystick.reset() }
                  }
              }
              override func touchesCancelled(_ touches: Set<UITouch>, with event: UIEvent?) {
                  touchesEnded(touches, with: event)
              }

              // Game Loop
              func renderer(_ renderer: SCNSceneRenderer, updateAtTime time: TimeInterval) {
                  guard !isGameOver else { return }
                  let dt = lastTime == 0 ? 0 : Float(min(time - lastTime, 0.05))
                  lastTime = time

                  handleInput(dt: dt)
                  updatePlayer(dt: dt)
                  updateObstacles(dt: dt)
                  spawnObjects(dt: dt)
                  roadManager.update(playerZ: playerZ)
                  cameraNode.position = SCNVector3(playerX, 2.5, playerZ + 5)

                  DispatchQueue.main.async {
                      self.hud.update(coins: self.coins, score: self.score)
                  }
              }

              private func handleInput(dt: Float) {
                  let vel = joystick.velocity
                  // horizontal movement - continuous lane
                  let targetX = playerX + vel.x * 8 * dt
                  let laneLimit: Float = 4.0  // half road width
                  playerX = max(-laneLimit, min(laneLimit, targetX))

                  // jump
                  if joystick.jumpTriggered && !isJumping {
                      isJumping = true
                      jumpTimer = 0
                      AudioManager.shared.play("jump")
                      joystick.jumpTriggered = false
                  }
              }

              private func updatePlayer(dt: Float) {
                  // Forward movement
                  playerZ += speed * dt

                  // Jump physics
                  if isJumping {
                      jumpTimer += dt
                      let progress = jumpTimer / jumpDuration
                      if progress >= 1.0 {
                          isJumping = false
                          player.updateAnimation(dt: dt, speed: speed, isGrounded: true)
                          player.position.y = 0
                      } else {
                          player.updateJumpAnimation(progress: progress)
                      }
                  } else {
                      player.updateAnimation(dt: dt, speed: speed, isGrounded: true)
                  }

                  player.position.x = playerX
                  player.position.z = 0  // relative to camera? We keep player at origin, world moves. We'll shift world.
                  // Actually easier: move player forward, and update road segments.
                  // Player position will be at (playerX, 0, playerZ) in world space.
                  player.position.z = playerZ
                  score = Int(playerZ)
              }

              private func updateObstacles(dt: Float) {
                  for obs in obstacles {
                      // check collision with player
                      let distX = abs(obs.position.x - playerX)
                      let distZ = obs.position.z - playerZ
                      if distZ > -1 && distZ < 1 && distX < 0.9 {
                          gameOver()
                          return
                      }
                      // Remove far behind
                      if obs.position.z < playerZ - 20 {
                          obs.removeFromParentNode()
                          obstacles.removeAll { $0 === obs }
                      }
                  }
                  for coin in coinNodes {
                      let distX = abs(coin.position.x - playerX)
                      let distZ = coin.position.z - playerZ
                      if distZ > -0.8 && distZ < 0.8 && distX < 0.8 {
                          coin.removeFromParentNode()
                          coinNodes.removeAll { $0 === coin }
                          coins += 1
                          AudioManager.shared.play("coin")
                      }
                      if coin.position.z < playerZ - 20 {
                          coin.removeFromParentNode()
                          coinNodes.removeAll { $0 === coin }
                      }
                  }
              }

              private func spawnObjects(dt: Float) {
                  spawnTimer += dt
                  if spawnTimer >= spawnInterval {
                      spawnTimer = 0
                      let lane = Float(Int.random(in: -1...1)) * 2.5
                      let z = playerZ + 40
                      if Bool.random() {
                          // spawn obstacle
                          let type = ObstacleType.allCases.randomElement()!
                          let obsGeo = SCNBox(width: CGFloat(type.width), height: CGFloat(type.height), length: 0.3, chamferRadius: 0.05)
                          let mat = SCNMaterial()
                          mat.diffuse.contents = UIColor.red
                          obsGeo.materials = [mat]
                          let obs = SCNNode(geometry: obsGeo)
                          obs.position = SCNVector3(lane, type.height/2, z)
                          obs.name = "obstacle"
                          scene.rootNode.addChildNode(obs)
                          obstacles.append(obs)
                      } else {
                          // spawn coin
                          let coinGeo = SCNSphere(radius: 0.3)
                          let coinMat = SCNMaterial()
                          coinMat.diffuse.contents = UIColor.yellow
                          coinGeo.materials = [coinMat]
                          let coinNode = SCNNode(geometry: coinGeo)
                          coinNode.position = SCNVector3(lane, 0.5, z)
                          coinNode.name = "coin"
                          scene.rootNode.addChildNode(coinNode)
                          coinNodes.append(coinNode)
                      }
                  }
              }

              private func gameOver() {
                  guard !isGameOver else { return }
                  isGameOver = true
                  AudioManager.shared.play("hit")
                  AudioManager.shared.stopBGM()
                  let alert = UIAlertController(title: "Game Over", message: "Score: \(score)  Coins: \(coins)", preferredStyle: .alert)
                  alert.addAction(UIAlertAction(title: "Restart", style: .default) { _ in
                      self.dismiss(animated: false)
                  })
                  alert.addAction(UIAlertAction(title: "Menu", style: .cancel) { _ in
                      self.dismiss(animated: false)
                  })
                  present(alert, animated: true)
              }

              override var prefersStatusBarHidden: Bool { true }
              override var supportedInterfaceOrientations: UIInterfaceOrientationMask { .landscape }
          }

          extension GameViewController: SCNPhysicsContactDelegate {
              func physicsWorld(_ world: SCNPhysicsWorld, didBegin contact: SCNPhysicsContact) {
                  // not using physics for collisions, manual detection
              }
          }
          SWIFT_EOF

