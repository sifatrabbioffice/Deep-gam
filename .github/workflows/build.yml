name: 🛩️ Sky Drift 3D – Flying Game

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-14
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Install Tools
        run: |
          brew install xcodegen
          gem install xcpretty --no-document 2>/dev/null || true

      - name: Create Directories
        run: |
          mkdir -p SkyDrift/Sources
          mkdir -p SkyDrift/Resources/Assets.xcassets/AppIcon.appiconset

      # ── AppDelegate ──────────────────────────────────────────────────────────
      - name: AppDelegate.swift
        run: |
          cat > SkyDrift/Sources/AppDelegate.swift << 'SWIFT_EOF'
          import UIKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(
                  _ application: UIApplication,
                  didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?
              ) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  window?.rootViewController = GameViewController()
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          SWIFT_EOF

      # ── Physics Categories ───────────────────────────────────────────────────
      - name: PhysicsCategory.swift
        run: |
          cat > SkyDrift/Sources/PhysicsCategory.swift << 'SWIFT_EOF'
          struct PhysicsCategory {
              static let none:     Int = 0
              static let player:   Int = 1 << 0
              static let obstacle: Int = 1 << 1
              static let ring:     Int = 1 << 2
          }
          SWIFT_EOF

      # ── GameViewController (main game logic) ─────────────────────────────────
      - name: GameViewController.swift
        run: |
          cat > SkyDrift/Sources/GameViewController.swift << 'SWIFT_EOF'
          import UIKit
          import SceneKit

          class GameViewController: UIViewController, SCNSceneRendererDelegate, SCNPhysicsContactDelegate {

              private var scnView: SCNView!
              private var scene: SCNScene!
              private var planeNode: SCNNode!
              private var cameraNode: SCNNode!

              private var isGameOver = false
              private var score = 0
              private var highScore = 0
              private var speed: Float = 8.0          // forward speed
              private var horizontalSpeed: Float = 0

              private var spawnTimer: TimeInterval = 0
              private var lastTime: TimeInterval = 0
              private var obstacles: [SCNNode] = []
              private var rings: [SCNNode] = []

              private var scoreLabel: UILabel!
              private var gameOverView: UIView?

              private var tiltJoystick: JoystickView!  // touch joystick for horizontal movement

              override func viewDidLoad() {
                  super.viewDidLoad()
                  setupScene()
                  setupPlane()
                  setupCamera()
                  setupLighting()
                  setupHUD()
                  setupJoystick()
                  startGame()
              }

              override var prefersStatusBarHidden: Bool { true }
              override var shouldAutorotate: Bool { true }
              override var supportedInterfaceOrientations: UIInterfaceOrientationMask { .landscape }

              private func setupScene() {
                  scnView = SCNView(frame: view.bounds)
                  scnView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  scnView.backgroundColor = UIColor(red: 0.6, green: 0.85, blue: 1.0, alpha: 1)
                  scnView.antialiasingMode = .multisampling4X
                  view.addSubview(scnView)

                  scene = SCNScene()
                  scene.background.contents = UIColor(red: 0.6, green: 0.85, blue: 1.0, alpha: 1)
                  scene.physicsWorld.contactDelegate = self
                  scene.physicsWorld.gravity = SCNVector3(0, 0, 0)   // no gravity in flying game
                  scnView.scene = scene
                  scnView.delegate = self
                  scnView.isPlaying = true

                  // Ground (visual only)
                  let ground = SCNFloor()
                  let groundMat = SCNMaterial()
                  groundMat.diffuse.contents = UIColor(red: 0.3, green: 0.7, blue: 0.3, alpha: 1)
                  ground.materials = [groundMat]
                  let groundNode = SCNNode(geometry: ground)
                  groundNode.position = SCNVector3(0, -2, 0)
                  scene.rootNode.addChildNode(groundNode)
              }

              private func setupPlane() {
                  // Paper plane made of simple shapes
                  planeNode = SCNNode()
                  planeNode.position = SCNVector3(0, 0, 0)

                  // Body
                  let bodyGeo = SCNCylinder(radius: 0.15, height: 1.2)
                  bodyGeo.firstMaterial?.diffuse.contents = UIColor.white
                  let body = SCNNode(geometry: bodyGeo)
                  body.eulerAngles = SCNVector3(Float.pi/2, 0, 0) // horizontal
                  planeNode.addChildNode(body)

                  // Wings
                  let wingGeo = SCNBox(width: 0.8, height: 0.02, length: 0.25, chamferRadius: 0.05)
                  wingGeo.firstMaterial?.diffuse.contents = UIColor(red: 0.9, green: 0.2, blue: 0.2, alpha: 1)
                  let wing = SCNNode(geometry: wingGeo)
                  wing.position = SCNVector3(0, 0, 0)
                  planeNode.addChildNode(wing)

                  // Tail
                  let tailGeo = SCNBox(width: 0.2, height: 0.02, length: 0.4, chamferRadius: 0.02)
                  tailGeo.firstMaterial?.diffuse.contents = UIColor(red: 0.9, green: 0.2, blue: 0.2, alpha: 1)
                  let tail = SCNNode(geometry: tailGeo)
                  tail.position = SCNVector3(0, 0, 0.5)
                  planeNode.addChildNode(tail)

                  // Physics
                  let shape = SCNPhysicsShape(geometry: SCNBox(width: 0.6, height: 0.2, length: 1.2, chamferRadius: 0.1), options: nil)
                  planeNode.physicsBody = SCNPhysicsBody(type: .kinematic, shape: shape)
                  planeNode.physicsBody?.categoryBitMask = PhysicsCategory.player
                  planeNode.physicsBody?.contactTestBitMask = PhysicsCategory.obstacle | PhysicsCategory.ring
                  planeNode.physicsBody?.collisionBitMask = PhysicsCategory.none

                  scene.rootNode.addChildNode(planeNode)
              }

              private func setupCamera() {
                  cameraNode = SCNNode()
                  cameraNode.camera = SCNCamera()
                  cameraNode.camera?.fieldOfView = 60
                  cameraNode.position = SCNVector3(0, 2, 5)
                  cameraNode.eulerAngles = SCNVector3(-0.3, 0, 0)
                  scene.rootNode.addChildNode(cameraNode)
              }

              private func setupLighting() {
                  let ambient = SCNNode()
                  ambient.light = SCNLight()
                  ambient.light?.type = .ambient
                  ambient.light?.color = UIColor(white: 0.7, alpha: 1)
                  scene.rootNode.addChildNode(ambient)

                  let directional = SCNNode()
                  directional.light = SCNLight()
                  directional.light?.type = .directional
                  directional.light?.color = UIColor(white: 0.9, alpha: 1)
                  directional.eulerAngles = SCNVector3(-Float.pi/4, 0, 0)
                  scene.rootNode.addChildNode(directional)
              }

              private func setupHUD() {
                  scoreLabel = UILabel(frame: CGRect(x: 20, y: 20, width: 300, height: 40))
                  scoreLabel.font = UIFont(name: "Courier-Bold", size: 28) ?? UIFont.boldSystemFont(ofSize: 28)
                  scoreLabel.textColor = .white
                  scoreLabel.text = "SCORE: 0"
                  view.addSubview(scoreLabel)
              }

              private func setupJoystick() {
                  let radius: CGFloat = 60
                  tiltJoystick = JoystickView(radius: radius)
                  tiltJoystick.center = CGPoint(x: view.bounds.width - radius - 20, y: view.bounds.height - radius - 20)
                  view.addSubview(tiltJoystick)
              }

              private func startGame() {
                  isGameOver = false
                  score = 0
                  speed = 8.0
                  planeNode.position = SCNVector3(0, 0, 0)
                  planeNode.eulerAngles = SCNVector3Zero
                  obstacles.forEach { $0.removeFromParentNode() }
                  rings.forEach { $0.removeFromParentNode() }
                  obstacles.removeAll()
                  rings.removeAll()
                  spawnTimer = 0
                  lastTime = 0
                  updateHUD()
              }

              // MARK: - Game Loop

              func renderer(_ renderer: SCNSceneRenderer, updateAtTime time: TimeInterval) {
                  guard !isGameOver else { return }
                  let dt = lastTime == 0 ? 0 : Float(min(time - lastTime, 0.05))
                  lastTime = time

                  // Move plane forward (world moves backward)
                  speed += 0.02 * dt   // gradually increase speed
                  let moveZ = -speed * dt
                  scene.rootNode.childNodes.forEach { node in
                      if node.name == "obstacle" || node.name == "ring" {
                          node.position.z += moveZ * 0.5  // move obstacles toward player
                      }
                  }

                  // Horizontal movement from joystick
                  horizontalSpeed = tiltJoystick.velocity.x * 4.0   // left/right
                  planeNode.position.x += horizontalSpeed * dt
                  planeNode.position.x = max(-5, min(5, planeNode.position.x))

                  // Spawn obstacles and rings
                  spawnTimer += Double(dt)
                  if spawnTimer > 1.2 {
                      spawnTimer = 0
                      spawnObstacle()
                      if Int.random(in: 0...2) == 0 { spawnRing() }
                  }

                  // Remove off-screen objects (behind camera)
                  obstacles.removeAll { node in
                      if node.position.z > 10 {
                          node.removeFromParentNode()
                          return true
                      }
                      return false
                  }
                  rings.removeAll { node in
                      if node.position.z > 10 {
                          node.removeFromParentNode()
                          return true
                      }
                      return false
                  }

                  updateHUD()
              }

              private func spawnObstacle() {
                  let building = SCNBox(width: 1.5, height: CGFloat.random(in: 2...6), length: 1.5, chamferRadius: 0.1)
                  building.firstMaterial?.diffuse.contents = UIColor(
                      red: CGFloat.random(in: 0.2...0.4),
                      green: CGFloat.random(in: 0.2...0.4),
                      blue: CGFloat.random(in: 0.2...0.4),
                      alpha: 1
                  )
                  let node = SCNNode(geometry: building)
                  node.name = "obstacle"
                  node.position = SCNVector3(Float.random(in: -4...4), building.height/2, -20)
                  node.physicsBody = SCNPhysicsBody(type: .static, shape: nil)
                  node.physicsBody?.categoryBitMask = PhysicsCategory.obstacle
                  node.physicsBody?.contactTestBitMask = PhysicsCategory.player
                  node.physicsBody?.collisionBitMask = PhysicsCategory.none
                  scene.rootNode.addChildNode(node)
                  obstacles.append(node)
              }

              private func spawnRing() {
                  let ringGeo = SCNTorus(ringRadius: 0.6, pipeRadius: 0.08)
                  ringGeo.firstMaterial?.diffuse.contents = UIColor.yellow
                  ringGeo.firstMaterial?.emission.contents = UIColor.orange
                  let node = SCNNode(geometry: ringGeo)
                  node.name = "ring"
                  node.position = SCNVector3(Float.random(in: -3...3), Float.random(in: -1...2), -20)
                  node.physicsBody = SCNPhysicsBody(type: .static, shape: SCNPhysicsShape(geometry: ringGeo, options: nil))
                  node.physicsBody?.categoryBitMask = PhysicsCategory.ring
                  node.physicsBody?.contactTestBitMask = PhysicsCategory.player
                  node.physicsBody?.collisionBitMask = PhysicsCategory.none
                  node.runAction(SCNAction.repeatForever(SCNAction.rotateBy(x: 0, y: .pi*2, z: 0, duration: 2)))
                  scene.rootNode.addChildNode(node)
                  rings.append(node)
              }

              private func updateHUD() {
                  DispatchQueue.main.async {
                      self.scoreLabel.text = "SCORE: \(self.score)"
                  }
              }

              // MARK: - Collisions

              func physicsWorld(_ world: SCNPhysicsWorld, didBegin contact: SCNPhysicsContact) {
                  let maskA = contact.nodeA.physicsBody?.categoryBitMask ?? 0
                  let maskB = contact.nodeB.physicsBody?.categoryBitMask ?? 0

                  if (maskA == PhysicsCategory.player && maskB == PhysicsCategory.ring) ||
                     (maskB == PhysicsCategory.player && maskA == PhysicsCategory.ring) {
                      let ringNode = maskA == PhysicsCategory.ring ? contact.nodeA : contact.nodeB
                      ringNode.removeFromParentNode()
                      score += 10
                  }

                  if (maskA == PhysicsCategory.player && maskB == PhysicsCategory.obstacle) ||
                     (maskB == PhysicsCategory.player && maskA == PhysicsCategory.obstacle) {
                      gameOver()
                  }
              }

              private func gameOver() {
                  guard !isGameOver else { return }
                  isGameOver = true
                  if score > highScore { highScore = score }

                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.5) { [weak self] in
                      self?.showGameOverScreen()
                  }
              }

              private func showGameOverScreen() {
                  let overlay = UIView(frame: view.bounds)
                  overlay.backgroundColor = UIColor(white: 0, alpha: 0.7)
                  view.addSubview(overlay)
                  gameOverView = overlay

                  let label = UILabel(frame: CGRect(x: 0, y: overlay.bounds.midY - 80, width: overlay.bounds.width, height: 50))
                  label.text = "GAME OVER"
                  label.textAlignment = .center
                  label.font = UIFont(name: "Courier-Bold", size: 40) ?? UIFont.boldSystemFont(ofSize: 40)
                  label.textColor = .white
                  overlay.addSubview(label)

                  let scoreText = UILabel(frame: CGRect(x: 0, y: overlay.bounds.midY - 20, width: overlay.bounds.width, height: 40))
                  scoreText.text = "SCORE: \(score)   BEST: \(highScore)"
                  scoreText.textAlignment = .center
                  scoreText.font = UIFont(name: "Courier", size: 24) ?? UIFont.systemFont(ofSize: 24)
                  scoreText.textColor = .yellow
                  overlay.addSubview(scoreText)

                  let restartBtn = UIButton(type: .custom)
                  restartBtn.frame = CGRect(x: overlay.bounds.midX - 100, y: overlay.bounds.midY + 40, width: 200, height: 50)
                  restartBtn.setTitle("🔄 PLAY AGAIN", for: .normal)
                  restartBtn.titleLabel?.font = UIFont(name: "Courier-Bold", size: 22) ?? UIFont.boldSystemFont(ofSize: 22)
                  restartBtn.backgroundColor = UIColor(red: 0.2, green: 0.6, blue: 0.2, alpha: 1)
                  restartBtn.layer.cornerRadius = 12
                  restartBtn.addTarget(self, action: #selector(restartGame), for: .touchUpInside)
                  overlay.addSubview(restartBtn)
              }

              @objc private func restartGame() {
                  gameOverView?.removeFromSuperview()
                  gameOverView = nil
                  startGame()
              }

              override func touchesBegan(_ touches: Set<UITouch>, with event: UIEvent?) {
                  guard let touch = touches.first else { return }
                  let pt = touch.location(in: view)
                  if tiltJoystick.frame.contains(pt) {
                      tiltJoystick.trackingTouch = touch
                  }
              }

              override func touchesMoved(_ touches: Set<UITouch>, with event: UIEvent?) {
                  for touch in touches {
                      if touch === tiltJoystick.trackingTouch {
                          tiltJoystick.moveTouch(touch, in: view)
                      }
                  }
              }

              override func touchesEnded(_ touches: Set<UITouch>, with event: UIEvent?) {
                  for touch in touches {
                      if touch === tiltJoystick.trackingTouch {
                          tiltJoystick.reset()
                      }
                  }
              }

              override func touchesCancelled(_ touches: Set<UITouch>, with event: UIEvent?) {
                  touchesEnded(touches, with: event)
              }
          }
          SWIFT_EOF

      # ── JoystickView (same as before) ────────────────────────────────────────
      - name: JoystickView.swift
        run: |
          cat > SkyDrift/Sources/JoystickView.swift << 'SWIFT_EOF'
          import UIKit

          class JoystickView: UIView {
              private let ring = UIView()
              private let knob = UIView()
              let radius: CGFloat
              var velocity: SIMD2<Float> = .zero
              var isActive: Bool = false
              weak var trackingTouch: UITouch?

              init(radius: CGFloat) {
                  self.radius = radius
                  super.init(frame: CGRect(x: 0, y: 0, width: radius * 2, height: radius * 2))
                  isUserInteractionEnabled = false
                  alpha = 0.78

                  ring.frame               = bounds
                  ring.layer.cornerRadius  = radius
                  ring.backgroundColor     = UIColor(white: 1, alpha: 0.07)
                  ring.layer.borderColor   = UIColor(white: 1, alpha: 0.26).cgColor
                  ring.layer.borderWidth   = 2
                  addSubview(ring)

                  let kR                   = radius * 0.38
                  knob.frame               = CGRect(x: radius - kR, y: radius - kR, width: kR * 2, height: kR * 2)
                  knob.layer.cornerRadius  = kR
                  knob.backgroundColor     = UIColor(white: 1, alpha: 0.32)
                  knob.layer.borderColor   = UIColor(white: 1, alpha: 0.5).cgColor
                  knob.layer.borderWidth   = 1.5
                  addSubview(knob)
              }
              required init?(coder: NSCoder) { fatalError() }

              func moveTouch(_ touch: UITouch, in parentView: UIView) {
                  let pt   = touch.location(in: parentView)
                  let cx   = frame.midX, cy = frame.midY
                  let dx   = Float(pt.x - cx), dy = Float(pt.y - cy)
                  let dist = sqrt(dx * dx + dy * dy)
                  let maxD = Float(radius)
                  let f    = dist <= maxD ? 1.0 : maxD / dist
                  knob.center = CGPoint(x: cx + CGFloat(dx * f), y: cy + CGFloat(dy * f))
                  velocity    = SIMD2<Float>(dx * f / maxD, dy * f / maxD)
                  isActive    = dist > maxD * 0.12
              }

              func reset() {
                  knob.center   = CGPoint(x: radius, y: radius)
                  velocity      = .zero
                  isActive      = false
                  trackingTouch = nil
              }
          }
          SWIFT_EOF

      # ── project.yml ───────────────────────────────────────────────────────────
      - name: project.yml
        run: |
          cat > SkyDrift/project.yml << 'YAML_EOF'
          name: SkyDrift3D
          options:
            bundleIdPrefix: com.skydrift3d
            createIntermediateGroups: true
            deploymentTarget:
              iOS: "16.0"
          settings:
            base:
              SWIFT_VERSION: "5.9"
              DEVELOPMENT_TEAM: ""
              PRODUCT_BUNDLE_IDENTIFIER: com.skydrift3d.game
              TARGETED_DEVICE_FAMILY: "1"
              IPHONEOS_DEPLOYMENT_TARGET: "16.0"
              CODE_SIGN_IDENTITY: ""
              CODE_SIGNING_REQUIRED: "NO"
              CODE_SIGNING_ALLOWED: "NO"
              ENABLE_BITCODE: "NO"
              DEBUG_INFORMATION_FORMAT: dwarf
              SUPPORTS_MACCATALYST: "NO"
          targets:
            SkyDrift3D:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: Sources
              resources:
                - path: Resources
              settings:
                base:
                  INFOPLIST_FILE: Resources/Info.plist
                  PRODUCT_NAME: SkyDrift3D
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  CURRENT_PROJECT_VERSION: "1"
                  MARKETING_VERSION: "1.0"
              frameworks:
                - SDK: SceneKit.framework
                - SDK: UIKit.framework
          YAML_EOF

      # ── Info.plist ────────────────────────────────────────────────────────────
      - name: Info.plist
        run: |
          cat > SkyDrift/Resources/Info.plist << 'PLIST_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key><string>en</string>
              <key>CFBundleDisplayName</key><string>Sky Drift 3D</string>
              <key>CFBundleExecutable</key><string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key><string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
              <key>CFBundleName</key><string>SkyDrift3D</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>UILaunchStoryboardName</key><string>LaunchScreen</string>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UIRequiresFullScreen</key><true/>
              <key>UIStatusBarHidden</key><true/>
              <key>UIViewControllerBasedStatusBarAppearance</key><false/>
          </dict>
          </plist>
          PLIST_EOF

      # ── LaunchScreen ──────────────────────────────────────────────────────────
      - name: LaunchScreen.storyboard
        run: |
          cat > SkyDrift/Resources/LaunchScreen.storyboard << 'XML_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0"
                    toolsVersion="21701" targetRuntime="AppleCocoa Touch"
                    propertyAccessControl="none" useAutolayout="YES"
                    launchScreen="YES" useTraitCollections="YES" useSafeAreas="YES">
              <dependencies>
                  <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="21678"/>
              </dependencies>
              <scenes>
                  <scene sceneID="sc1">
                      <objects>
                          <viewController id="vc1" sceneMemberID="viewController">
                              <view key="view" contentMode="scaleToFill" id="vw1">
                                  <rect key="frame" x="0.0" y="0.0" width="430" height="932"/>
                                  <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                                  <color key="backgroundColor" red="0.6" green="0.85" blue="1.0" alpha="1"/>
                                  <label opaque="NO" userInteractionEnabled="NO" contentMode="left"
                                         text="SKY DRIFT 3D" textAlignment="center"
                                         lineBreakMode="middleTruncation" baselineAdjustment="alignBaselines"
                                         adjustsFontSizeToFit="NO"
                                         translatesAutoresizingMaskIntoConstraints="NO" id="lb1">
                                      <rect key="frame" x="0.0" y="396" width="430" height="60"/>
                                      <fontDescription key="fontDescription" type="boldSystem" pointSize="36"/>
                                      <color key="textColor" red="1" green="1" blue="1" alpha="1"/>
                                      <nil key="highlightedColor"/>
                                  </label>
                              </view>
                          </viewController>
                      </objects>
                  </scene>
              </scenes>
          </document>
          XML_EOF

      # ── AppIcon (simple) ──────────────────────────────────────────────────────
      - name: Generate AppIcon
        run: |
          cat > SkyDrift/Resources/Assets.xcassets/AppIcon.appiconset/Contents.json << 'JSON_EOF'
          {
            "images":[{"idiom":"universal","platform":"ios","size":"1024x1024", "filename":"icon.png","scale":"1x"}],
            "info":{"author":"xcode","version":1}
          }
          JSON_EOF
          cat > SkyDrift/Resources/Assets.xcassets/Contents.json << 'JSON_EOF'
          {"info":{"author":"xcode","version":1}}
          JSON_EOF
          python3 - << 'PYEOF'
          import struct, zlib
          def png(w, h):
              def u32(n): return struct.pack('>I', n)
              def chunk(t, d): return u32(len(d)) + t + d + u32(zlib.crc32(t+d) & 0xffffffff)
              rows = []
              for y in range(h):
                  row = [0]
                  for x in range(w):
                      r, g, b = 100, 180, 255  # sky blue
                      row += [r, g, b]
                  rows.append(bytes(row))
              raw  = zlib.compress(b''.join(rows), 9)
              sig  = b'\x89PNG\r\n\x1a\n'
              ihdr = u32(w) + u32(h) + bytes([8, 2, 0, 0, 0])
              return sig + chunk(b'IHDR', ihdr) + chunk(b'IDAT', raw) + chunk(b'IEND', b'')
          with open('SkyDrift/Resources/Assets.xcassets/AppIcon.appiconset/icon.png', 'wb') as f:
              f.write(png(1024, 1024))
          print("Icon OK")
          PYEOF

      # ── XcodeGen ─────────────────────────────────────────────────────────────
      - name: Generate Xcode Project
        working-directory: SkyDrift
        run: xcodegen generate --spec project.yml --project .

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project SkyDrift/SkyDrift3D.xcodeproj \
            -scheme SkyDrift3D \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            SWIFT_VERSION=5.9 \
            OBJROOT="${{ github.workspace }}/build/obj" \
            SYMROOT="${{ github.workspace }}/build/sym" \
            clean build 2>&1 | tee build.log | xcpretty || \
            (echo "=== BUILD ERRORS ===" && grep "error:" build.log | head -30 && exit 1)

      # ── Package IPA ───────────────────────────────────────────────────────────
      - name: Package IPA
        run: |
          APP=$(find "${{ github.workspace }}/build/sym" -name "SkyDrift3D.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "❌ .app not found"
            grep "error:" build.log | head -20
            exit 1
          fi
          echo "✅ Found: $APP ($(du -sh "$APP" | cut -f1))"
          mkdir -p Payload
          cp -r "$APP" Payload/SkyDrift3D.app
          rm -rf Payload/SkyDrift3D.app/_CodeSignature 2>/dev/null || true
          zip -r SkyDrift3D.ipa Payload
          echo "📦 IPA: $(du -sh SkyDrift3D.ipa | cut -f1)"

      # ── Upload ────────────────────────────────────────────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SkyDrift3D-iPhone
          path: SkyDrift3D.ipa
          retention-days: 30

