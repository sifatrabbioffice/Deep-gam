              override func viewDidLoad() {
                  super.viewDidLoad()
                  setupScene()
                  buildWorld()
                  spawnPlayer()
                  setupCamera()
                  setupLighting()
                  setupHUD()
                  setupJoysticks()
                  applyEnvironmentTheme(environmentTheme)   // ⭐ apply initial theme
                  waveTimer = 3.0
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.6) { [weak self] in
                      self?.hudView.showMessage("WAVE 1 INCOMING!", color: UIColor(red: 1, green: 0.2, blue: 0.2, alpha: 1), duration: 2.5)
                  }
              }

              override var prefersStatusBarHidden: Bool { return true }
              override var shouldAutorotate: Bool { return true }
              override var supportedInterfaceOrientations: UIInterfaceOrientationMask { return .landscape }
              override var prefersHomeIndicatorAutoHidden: Bool { return true }

              private func setupScene() {
                  scnView = SCNView(frame: view.bounds)
                  scnView.autoresizingMask        = [.flexibleWidth, .flexibleHeight]
                  scnView.backgroundColor         = UIColor(red: 0.02, green: 0.01, blue: 0.02, alpha: 1)
                  scnView.antialiasingMode         = .multisampling4X
                  scnView.preferredFramesPerSecond = 60
                  view.addSubview(scnView)

                  scene = SCNScene()
                  scene.background.contents        = UIColor(red: 0.04, green: 0.03, blue: 0.07, alpha: 1)
                  scene.physicsWorld.contactDelegate = self
                  scene.physicsWorld.gravity         = SCNVector3(0, -12, 0)
                  scnView.scene    = scene
                  scnView.delegate = self
                  scnView.isPlaying = true
              }

              private func buildWorld() {
                  buildGround()
                  buildBorders()
                  buildBuildings()
                  buildTrees()
                  addFogAndLights()
              }

              private func buildGround() {
                  let geo = SCNFloor()
                  let mat = SCNMaterial()
                  mat.diffuse.contents   = environmentTheme.groundColor
                  mat.roughness.contents = 1.0
                  mat.lightingModel      = .lambert
                  geo.materials = [mat]
                  let node = SCNNode(geometry: geo)
                  node.name = "ground"
                  node.physicsBody = SCNPhysicsBody(type: .static, shape: nil)
                  node.physicsBody?.categoryBitMask  = PhysicsMask.ground
                  node.physicsBody?.collisionBitMask = PhysicsMask.player | PhysicsMask.enemy | PhysicsMask.bullet
                  scene.rootNode.addChildNode(node)
                  groundNode = node
              }

              private func buildBorders() {
                  let h: Float = 8, t: Float = 1.5, s = mapHalf * 2
                  let walls: [(Float, Float, Float, Float, Float, Float)] = [
                      (0, h/2, -(mapHalf+t/2), s+t*2, h, t),
                      (0, h/2,  (mapHalf+t/2), s+t*2, h, t),
                      (-(mapHalf+t/2), h/2, 0, t, h, s),
                      ( (mapHalf+t/2), h/2, 0, t, h, s)
                  ]
                  for (x, y, z, w, hh, d) in walls {
                      let geo = SCNBox(width: CGFloat(w), height: CGFloat(hh), length: CGFloat(d), chamferRadius: 0)
                      let mat = SCNMaterial()
                      mat.diffuse.contents = environmentTheme.wallColor
                      mat.lightingModel    = .lambert
                      geo.materials = [mat]
                      let node = SCNNode(geometry: geo)
                      node.name = "wall"
                      node.position = SCNVector3(x, y, z)
                      node.physicsBody = SCNPhysicsBody(type: .static, shape: nil)
                      node.physicsBody?.categoryBitMask  = PhysicsMask.wall
                      node.physicsBody?.collisionBitMask = PhysicsMask.player | PhysicsMask.enemy | PhysicsMask.bullet
                      scene.rootNode.addChildNode(node)
                      wallNodes.append(node)
                  }
              }

              private func buildBuildings() {
                  let data: [(Float, Float, Float, Float)] = [
                      (-14, -18, 5.5, 7), (10, -16, 4.5, 6), (-8, 14, 6, 8),
                      (16,   9,  4,  6),  (-18, 4, 4, 7),    (4, 19, 5, 7),
                      (-4, -9,  4,  5),   (14, -4, 4, 6),    (0,  0, 3, 5),
                      (-21, -11, 4, 7),   (21, -16, 4, 5),   (7, -23, 5, 6)
                  ]
                  for (x, z, w, h) in data { addBuilding(at: SCNVector3(x, 0, z), w: w, h: h, d: w * 0.85) }
              }

              private func addBuilding(at pos: SCNVector3, w: Float, h: Float, d: Float) {
                  let geo = SCNBox(width: CGFloat(w), height: CGFloat(h), length: CGFloat(d), chamferRadius: 0.06)
                  let mat = SCNMaterial()
                  mat.diffuse.contents = environmentTheme.buildingColor
                  mat.lightingModel = .lambert
                  geo.materials = [mat]
                  let node = SCNNode(geometry: geo)
                  node.name = "building"
                  node.position    = SCNVector3(pos.x, h / 2, pos.z)
                  node.physicsBody = SCNPhysicsBody(type: .static, shape: nil)
                  node.physicsBody?.categoryBitMask  = PhysicsMask.wall
                  node.physicsBody?.collisionBitMask = PhysicsMask.player | PhysicsMask.enemy | PhysicsMask.bullet
                  scene.rootNode.addChildNode(node)
                  buildingNodes.append(node)

                  let rh      = w * 0.45
                  let roofGeo = SCNPyramid(width: CGFloat(w + 0.4), height: CGFloat(rh), length: CGFloat(d + 0.4))
                  let roofMat = SCNMaterial()
                  roofMat.diffuse.contents = UIColor(red: 0.08, green: 0.06, blue: 0.04, alpha: 1)
                  roofMat.lightingModel    = .lambert
                  roofGeo.materials = [roofMat]
                  let roof = SCNNode(geometry: roofGeo)
                  roof.position = SCNVector3(pos.x, h + rh / 2, pos.z)
                  scene.rootNode.addChildNode(roof)

                  if Bool.random() { addWindowGlow(at: SCNVector3(pos.x, h * 0.5, pos.z - d / 2 - 0.1)) }
              }

              private func addWindowGlow(at pos: SCNVector3) {
                  let geo = SCNBox(width: 0.6, height: 0.8, length: 0.05, chamferRadius: 0.04)
                  let mat = SCNMaterial()
                  mat.diffuse.contents  = UIColor(red: 0.85, green: 0.72, blue: 0.30, alpha: 1)
                  mat.emission.contents = UIColor(red: 0.5, green: 0.4, blue: 0.15, alpha: 1)
                  mat.lightingModel     = .constant
                  geo.materials = [mat]
                  let node = SCNNode(geometry: geo)
                  node.position = pos
                  scene.rootNode.addChildNode(node)

                  let light   = SCNLight()
                  light.type  = .omni
                  light.color = UIColor(red: 0.8, green: 0.65, blue: 0.25, alpha: 1)
                  light.intensity = 120
                  light.attenuationStartDistance = 0.5
                  light.attenuationEndDistance   = 5
                  let ln = SCNNode()
                  ln.light    = light
                  ln.position = pos
                  scene.rootNode.addChildNode(ln)
              }

              private func buildTrees() {
                  let pts: [(Float, Float)] = [
                      (-25, -25), (-10, -27), (20, -24), (27, 4), (25, 20),
                      (-25, 18), (-27, 0), (0, -28), (11, 26), (-11, 25),
                      (18, -22), (-20, -20), (24, -10), (-26, 12)
                  ]
                  for (x, z) in pts { addTree(at: SCNVector3(x, 0, z)) }
              }

              private func addTree(at pos: SCNVector3) {
                  let trunk = SCNCylinder(radius: 0.22, height: 2.5)
                  let tMat  = SCNMaterial()
                  tMat.diffuse.contents = environmentTheme.treeTrunkColor
                  tMat.lightingModel    = .lambert
                  trunk.materials = [tMat]
                  let trunkNode = SCNNode(geometry: trunk)
                  trunkNode.name = "treeTrunk"
                  trunkNode.position    = SCNVector3(pos.x, 1.25, pos.z)
                  trunkNode.physicsBody = SCNPhysicsBody(type: .static, shape: nil)
                  trunkNode.physicsBody?.categoryBitMask  = PhysicsMask.wall
                  trunkNode.physicsBody?.collisionBitMask = PhysicsMask.player | PhysicsMask.enemy
                  scene.rootNode.addChildNode(trunkNode)
                  treeTrunks.append(trunkNode)

                  let leaves = SCNSphere(radius: 1.5)
                  let lMat   = SCNMaterial()
                  lMat.diffuse.contents = environmentTheme.treeLeavesColor
                  lMat.lightingModel    = .lambert
                  leaves.materials = [lMat]
                  let leavesNode = SCNNode(geometry: leaves)
                  leavesNode.name = "treeLeaves"
                  leavesNode.position = SCNVector3(pos.x, 4.0, pos.z)
                  scene.rootNode.addChildNode(leavesNode)
                  treeLeaves.append(leavesNode)
              }

              private func addFogAndLights() {
                  scene.fogColor           = environmentTheme.fogColor
                  scene.fogStartDistance   = 18
                  scene.fogEndDistance     = 65
                  scene.fogDensityExponent = 0.6

                  let torches: [(Float, Float)] = [
                      (-12, -12), (12, -12), (-12, 12), (12, 12),
                      (0, -22), (0, 22), (-22, 0), (22, 0)
                  ]
                  for (tx, tz) in torches {
                      let light   = SCNLight()
                      light.type  = .omni
                      light.color = UIColor(red: 1, green: 0.55, blue: 0.15, alpha: 1)
                      light.intensity = 350
                      light.attenuationStartDistance = 1
                      light.attenuationEndDistance   = 12
                      let node = SCNNode()
                      node.light    = light
                      node.position = SCNVector3(tx, 2.5, tz)
                      scene.rootNode.addChildNode(node)
                      node.runAction(SCNAction.repeatForever(SCNAction.sequence([
                          SCNAction.run { n in n.light?.intensity = CGFloat.random(in: 200...450) },
                          SCNAction.wait(duration: Double.random(in: 0.05...0.16))
                      ])))
                  }
              }

              // MARK: – 3D Man Character Construction & Spawning
              private func spawnPlayer() {
                  playerNode = SCNNode()
                  playerNode.position = SCNVector3(0, 1.2, 0)

                  playerBody = SCNNode()
                  playerNode.addChildNode(playerBody)

                  let jacketMat = SCNMaterial(); jacketMat.diffuse.contents = UIColor(red: 0.15, green: 0.25, blue: 0.45, alpha: 1); jacketMat.lightingModel = .lambert
                  let pantsMat = SCNMaterial(); pantsMat.diffuse.contents = UIColor(red: 0.10, green: 0.12, blue: 0.18, alpha: 1); pantsMat.lightingModel = .lambert
                  let skinMat = SCNMaterial(); skinMat.diffuse.contents = UIColor(red: 0.92, green: 0.76, blue: 0.65, alpha: 1); skinMat.lightingModel = .lambert

                  let torsoGeo = SCNBox(width: 0.55, height: 0.75, length: 0.35, chamferRadius: 0.08)
                  torsoGeo.materials = [jacketMat]
                  let torsoNode = SCNNode(geometry: torsoGeo)
                  torsoNode.position = SCNVector3(0, 0.3, 0)
                  playerBody.addChildNode(torsoNode)

                  let headGeo = SCNSphere(radius: 0.18)
                  headGeo.materials = [skinMat]
                  let headNode = SCNNode(geometry: headGeo)
                  headNode.position = SCNVector3(0, 0.78, 0)
                  playerBody.addChildNode(headNode)

                  let leftLegGeo = SCNCylinder(radius: 0.10, height: 0.65)
                  leftLegGeo.materials = [pantsMat]
                  leftLegNode = SCNNode(geometry: leftLegGeo)
                  leftLegNode.pivot = SCNMatrix4MakeTranslation(0, 0.325, 0)
                  leftLegNode.position = SCNVector3(-0.16, 0.0, 0)
                  playerBody.addChildNode(leftLegNode)

                  let rightLegGeo = SCNCylinder(radius: 0.10, height: 0.65)
                  rightLegGeo.materials = [pantsMat]
                  rightLegNode = SCNNode(geometry: rightLegGeo)
                  rightLegNode.pivot = SCNMatrix4MakeTranslation(0, 0.325, 0)
                  rightLegNode.position = SCNVector3(0.16, 0.0, 0)
                  playerBody.addChildNode(rightLegNode)

                  let leftArmGeo = SCNCylinder(radius: 0.08, height: 0.60)
                  leftArmGeo.materials = [jacketMat]
                  leftArmNode = SCNNode(geometry: leftArmGeo)
                  leftArmNode.pivot = SCNMatrix4MakeTranslation(0, 0.30, 0)
                  leftArmNode.position = SCNVector3(-0.36, 0.45, 0)
                  playerBody.addChildNode(leftArmNode)

                  let rightArmGeo = SCNCylinder(radius: 0.08, height: 0.60)
                  rightArmGeo.materials = [jacketMat]
                  rightArmNode = SCNNode(geometry: rightArmGeo)
                  rightArmNode.pivot = SCNMatrix4MakeTranslation(0, 0.30, 0)
                  rightArmNode.position = SCNVector3(0.36, 0.45, 0)
                  playerBody.addChildNode(rightArmNode)

                  let gunGeo = SCNBox(width: 0.08, height: 0.08, length: 0.55, chamferRadius: 0.02)
                  let gunMat = SCNMaterial()
                  gunMat.diffuse.contents = UIColor(red: 0.15, green: 0.15, blue: 0.15, alpha: 1)
                  gunGeo.materials = [gunMat]
                  let gun = SCNNode(geometry: gunGeo)
                  gun.position = SCNVector3(0, -0.25, -0.2)
                  gun.eulerAngles = SCNVector3(-Float.pi / 2, 0, 0)
                  rightArmNode.addChildNode(gun)

                  let shape = SCNPhysicsShape(geometry: SCNCapsule(capRadius: 0.40, height: 1.6), options: nil)
                  let body  = SCNPhysicsBody(type: .kinematic, shape: shape)
                  body.categoryBitMask    = PhysicsMask.player
                  body.contactTestBitMask = PhysicsMask.enemy | PhysicsMask.item
                  body.collisionBitMask   = PhysicsMask.wall | PhysicsMask.ground
                  playerNode.physicsBody  = body
                  scene.rootNode.addChildNode(playerNode)
              }

              private func setupCamera() {
                  cameraArm          = SCNNode()
                  cameraArm.position = SCNVector3(0, 1.8, 0)
                  playerNode.addChildNode(cameraArm)

                  cameraNode = SCNNode()
                  let cam    = SCNCamera()
                  cam.fieldOfView           = 75
                  cam.zFar                  = 200
                  cam.zNear                 = 0.05
                  cam.motionBlurIntensity   = 0.25
                  cameraNode.camera         = cam
                  cameraNode.position       = SCNVector3(0, 2.8, 7.2)
                  cameraNode.eulerAngles    = SCNVector3(cameraPitch, 0, 0)
                  cameraArm.addChildNode(cameraNode)
                  scnView.pointOfView = cameraNode
              }

              private func setupLighting() {
                  scnView.autoenablesDefaultLighting = false
                  let moon      = SCNLight()
                  moon.type     = .directional
                  moon.color    = environmentTheme.directionalColor
                  moon.intensity = 600
                  moon.castsShadow   = true
                  moon.shadowRadius  = 3
                  moon.shadowColor   = UIColor(white: 0, alpha: 0.7)
                  moon.shadowMapSize = CGSize(width: 2048, height: 2048)
                  let moonNode = SCNNode()
                  moonNode.light        = moon
                  moonNode.eulerAngles  = SCNVector3(-0.65, 0.4, 0)
                  scene.rootNode.addChildNode(moonNode)
                  moonLightNode = moonNode

                  let amb     = SCNLight()
                  amb.type    = .ambient
                  amb.color   = environmentTheme.ambientColor
                  amb.intensity = 200
                  let ambNode = SCNNode()
                  ambNode.light = amb
                  scene.rootNode.addChildNode(ambNode)
                  ambientLightNode = ambNode
