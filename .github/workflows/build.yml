      # ── AppIcon ───────────────────────────────────────────────────────────────
      - name: Generate AppIcon
        run: |
          cat > SV3D/Resources/Assets.xcassets/AppIcon.appiconset/Contents.json << 'JSON_EOF'
          {
            "images":[{"idiom":"universal","platform":"ios","size":"1024x1024", "filename":"icon.png","scale":"1x"}],
            "info":{"author":"xcode","version":1}
          }
          JSON_EOF
          cat > SV3D/Resources/Assets.xcassets/Contents.json << 'JSON_EOF'
          {"info":{"author":"xcode","version":1}}
          JSON_EOF
          python3 - << 'PYEOF'
          import struct, zlib, math
          def png(w, h):
              def u32(n): return struct.pack('>I', n)
              def chunk(t, d): return u32(len(d)) + t + d + u32(zlib.crc32(t+d) & 0xffffffff)
              rows = []
              for y in range(h):
                  row = [0]
                  for x in range(w):
                      cx, cy = x - w//2, y - h//2
                      dist = math.sqrt(cx*cx + cy*cy)
                      br = max(0, int(18 - dist*0.014))
                      bg = max(0, int(2  - dist*0.001))
                      bb = max(0, int(4  - dist*0.002))
                      md = math.sqrt((cx - w*0.25)**2 + (cy + h*0.25)**2)
                      if md < w * 0.17:
                          f = 1 - md/(w*0.17)
                          r = int(190*f + br*(1-f)); g = int(18*f + bg*(1-f)); b = int(8*f + bb*(1-f))
                      elif -55 < cx < 55 and -30 < cy < 30:
                          r, g, b = 128, 4, 4
                      else:
                          r, g, b = br, bg, bb
                      row += [min(255,r), min(255,g), min(255,b)]
                  rows.append(bytes(row))
              raw  = zlib.compress(b''.join(rows), 9)
              sig  = b'\x89PNG\r\n\x1a\n'
              ihdr = u32(w) + u32(h) + bytes([8, 2, 0, 0, 0])
              return sig + chunk(b'IHDR', ihdr) + chunk(b'IDAT', raw) + chunk(b'IEND', b'')
          with open('SV3D/Resources/Assets.xcassets/AppIcon.appiconset/icon.png', 'wb') as f:
              f.write(png(1024, 1024))
          print("Icon OK")
          PYEOF

      # ── XcodeGen ─────────────────────────────────────────────────────────────
      - name: Generate Xcode Project
        working-directory: SV3D
        run: xcodegen generate --spec project.yml --project .

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project SV3D/ShadowVillage3D.xcodeproj \
            -scheme ShadowVillage3D \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            SWIFT_VERSION=5.9 \
            OBJROOT="${{ github.workspace }}/build/obj" \
            SYMROOT="${{ github.workspace }}/build/sym" \
            clean build 2>&1 | tee build.log | xcpretty || \
            (echo "=== BUILD ERRORS ===" && grep "error:" build.log | head -30 && exit 1)

      # ── Package IPA ───────────────────────────────────────────────────────────
      - name: Package IPA
        run: |
          APP=$(find "${{ github.workspace }}/build/sym" -name "ShadowVillage3D.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "❌ .app not found"
            grep "error:" build.log | head -20
            exit 1
          fi
          echo "✅ Found: $APP ($(du -sh "$APP" | cut -f1))"
          mkdir -p Payload
          cp -r "$APP" Payload/ShadowVillage3D.app
          rm -rf Payload/ShadowVillage3D.app/_CodeSignature 2>/dev/null || true
          zip -r ShadowVillage3D.ipa Payload
          echo "📦 IPA: $(du -sh ShadowVillage3D.ipa | cut -f1)"

      # ── Upload ────────────────────────────────────────────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShadowVillage3D-iPhone15ProMax
          path: ShadowVillage3D.ipa
          retention-days: 30

