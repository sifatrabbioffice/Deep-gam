# ============================================================================
#  APP ICON GENERATION
# ============================================================================
      - name: Generate AppIcon
        run: |
          cat > InfinityRun/Resources/Assets.xcassets/AppIcon.appiconset/Contents.json << 'JSON_EOF'
          {
            "images":[{"idiom":"universal","platform":"ios","size":"1024x1024", "filename":"icon.png","scale":"1x"}],
            "info":{"author":"xcode","version":1}
          }
          JSON_EOF
          cat > InfinityRun/Resources/Assets.xcassets/Contents.json << 'JSON_EOF'
          {"info":{"author":"xcode","version":1}}
          JSON_EOF
          python3 - << 'PYEOF'
          import struct, zlib, math
          def png(w, h):
              def u32(n): return struct.pack('>I', n)
              def chunk(t, d): return u32(len(d)) + t + d + u32(zlib.crc32(t+d) & 0xffffffff)
              rows = []
              for y in range(h):
                  row = [0]
                  for x in range(w):
                      cx, cy = x - w//2, y - h//2
                      r = 15; g = 10; b = 30
                      if abs(cy) < h*0.1: r,g,b = 60,60,60
                      row += [r, g, b]
                  rows.append(bytes(row))
              raw = zlib.compress(b''.join(rows), 9)
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', u32(w)+u32(h)+bytes([8,2,0,0,0])) + chunk(b'IDAT', raw) + chunk(b'IEND', b'')
          with open('InfinityRun/Resources/Assets.xcassets/AppIcon.appiconset/icon.png', 'wb') as f:
              f.write(png(1024, 1024))
          print("Icon OK")
          PYEOF

# ============================================================================
#  GENERATE SOUNDS (WAV)
# ============================================================================
      - name: Generate Sounds
        run: |
          python3 << 'PYEOF'
          import struct, wave, math, os
          def wav(path, freq, dur, vol=0.5, sr=44100):
              n = int(sr*dur)
              data = [struct.pack('<h', int(vol*32767*math.sin(2*math.pi*freq*i/sr))) for i in range(n)]
              with wave.open(path, 'w') as wf:
                  wf.setnchannels(1); wf.setsampwidth(2); wf.setframerate(sr)
                  wf.writeframes(b''.join(data))
          d = 'InfinityRun/Resources/Sounds'
          os.makedirs(d, exist_ok=True)
          wav(os.path.join(d,'coin.wav'), 1200, 0.12)
          wav(os.path.join(d,'jump.wav'), 500, 0.18)
          wav(os.path.join(d,'hit.wav'), 200, 0.4, vol=0.8)
          wav(os.path.join(d,'powerup.wav'), 800, 0.25)
          bgm = os.path.join(d,'bgm.wav')
          sr=22050; dur=4; n=int(sr*dur)
          samples=[]
          for i in range(n):
              t=i/sr
              note=261.63 if (i//(sr//4))%2==0 else 329.63
              samples.append(struct.pack('<h', int(0.25*32767*math.sin(2*math.pi*note*t))))
          with wave.open(bgm, 'w') as wf:
              wf.setnchannels(1); wf.setsampwidth(2); wf.setframerate(sr)
              wf.writeframes(b''.join(samples))
          print("Sounds OK")
          PYEOF

# ============================================================================
#  XCODEGEN & BUILD
# ============================================================================
      - name: Generate Xcode Project
        working-directory: InfinityRun
        run: xcodegen generate --spec project.yml --project .

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project InfinityRun/InfinityRun.xcodeproj \
            -scheme InfinityRun \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            SWIFT_VERSION=5.9 \
            OBJROOT="${{ github.workspace }}/build/obj" \
            SYMROOT="${{ github.workspace }}/build/sym" \
            clean build 2>&1 | tee build.log | xcpretty || \
            (echo "=== BUILD ERRORS ===" && grep "error:" build.log | head -40 && exit 1)

      - name: Package IPA
        run: |
          APP=$(find "${{ github.workspace }}/build/sym" -name "InfinityRun.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "❌ .app not found"
            grep "error:" build.log | head -20
            exit 1
          fi
          echo "✅ App found: $APP ($(du -sh "$APP" | cut -f1))"
          mkdir -p Payload
          cp -r "$APP" Payload/InfinityRun.app
          rm -rf Payload/InfinityRun.app/_CodeSignature 2>/dev/null || true
          zip -r InfinityRun.ipa Payload
          echo "📦 IPA: $(du -sh InfinityRun.ipa | cut -f1)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: InfinityRun-iPhone
          path: InfinityRun.ipa
          retention-days: 30

      - name: Summary
        run: |
          echo "╔═══════════════════════════════════════════╗"
          echo "║  🏁 INFINITY RUN 3D – BUILD SUCCESS       ║"
          echo "╠═══════════════════════════════════════════╣"
          echo "║  ✅ All errors fixed                      ║"
          echo "║  ✅ Obstacle material correct             ║"
          echo "║  ✅ Power-up colors fixed                 ║"
          echo "╠═══════════════════════════════════════════╣"
          echo "║  SIDELOAD:                                ║"
          echo "║  Download IPA → AltStore / Sideloadly    ║"
          echo "╚═══════════════════════════════════════════╝"
