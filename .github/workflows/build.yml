name: 🏁 INFINITY RUN 3D – AAA iOS Game

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-14
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Install Tools
        run: |
          brew install xcodegen
          gem install xcpretty --no-document 2>/dev/null || true

      - name: Create Directories
        run: |
          mkdir -p InfinityRun/Sources
          mkdir -p InfinityRun/Resources/Assets.xcassets/AppIcon.appiconset
          mkdir -p InfinityRun/Resources/Sounds

# ============================================================================
#  APP DELEGATE
# ============================================================================
      - name: AppDelegate.swift
        run: |
          cat > InfinityRun/Sources/AppDelegate.swift << 'SWIFT_EOF'
          import UIKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(
                  _ application: UIApplication,
                  didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?
              ) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  window?.rootViewController = MainMenuViewController()
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          SWIFT_EOF

# ============================================================================
#  TYPES & PREFERENCES
# ============================================================================
      - name: Types.swift
        run: |
          cat > InfinityRun/Sources/Types.swift << 'SWIFT_EOF'
          import Foundation
          import UIKit

          enum ObstacleType: CaseIterable {
              case low, tall, moving
              var height: Float { self == .tall ? 3.2 : 1.6 }
              var width: Float { 1.3 }
          }

          enum PowerUpType: CaseIterable {
              case magnet, shield, speedBoost
          }

          enum CharacterSkin: String, CaseIterable {
              case soldier = "Soldier"
              case ninja   = "Ninja"
              case cyborg  = "Cyborg"

              var bodyColor: UIColor {
                  switch self {
                  case .soldier: return UIColor(red: 0.15, green: 0.25, blue: 0.45, alpha: 1)
                  case .ninja:   return UIColor(red: 0.10, green: 0.10, blue: 0.10, alpha: 1)
                  case .cyborg:  return UIColor(red: 0.55, green: 0.55, blue: 0.65, alpha: 1)
                  }
              }
              var headColor: UIColor {
                  switch self {
                  case .soldier: return UIColor(red: 0.92, green: 0.76, blue: 0.65, alpha: 1)
                  case .ninja:   return UIColor(red: 0.80, green: 0.68, blue: 0.58, alpha: 1)
                  case .cyborg:  return UIColor(red: 0.75, green: 0.75, blue: 0.80, alpha: 1)
                  }
              }
              var legsColor: UIColor {
                  switch self {
                  case .soldier: return UIColor(red: 0.10, green: 0.12, blue: 0.18, alpha: 1)
                  case .ninja:   return UIColor(red: 0.08, green: 0.08, blue: 0.10, alpha: 1)
                  case .cyborg:  return UIColor(red: 0.35, green: 0.35, blue: 0.40, alpha: 1)
                  }
              }
          }

          extension UserDefaults {
              private enum Keys {
                  static let skin = "selected_skin"
                  static let volume = "sound_volume"
              }
              var selectedSkin: CharacterSkin {
                  get { CharacterSkin(rawValue: string(forKey: Keys.skin) ?? "") ?? .soldier }
                  set { set(newValue.rawValue, forKey: Keys.skin) }
              }
              var soundVolume: Float {
                  get { float(forKey: Keys.volume) != 0 ? float(forKey: Keys.volume) : 0.7 }
                  set { set(newValue, forKey: Keys.volume) }
              }
          }
          SWIFT_EOF

# ============================================================================
#  AUDIO MANAGER
# ============================================================================
      - name: AudioManager.swift
        run: |
          cat > InfinityRun/Sources/AudioManager.swift << 'SWIFT_EOF'
          import AVFoundation

          class AudioManager {
              static let shared = AudioManager()
              private var players: [String: AVAudioPlayer] = [:]
              private var bgmPlayer: AVAudioPlayer?

              func preload() {
                  let sounds = ["coin", "jump", "hit", "powerup", "bgm"]
                  for name in sounds {
                      guard let url = Bundle.main.url(forResource: name, withExtension: "wav") else { continue }
                      do {
                          let player = try AVAudioPlayer(contentsOf: url)
                          player.prepareToPlay()
                          if name == "bgm" {
                              player.numberOfLoops = -1
                              player.volume = UserDefaults.standard.soundVolume
                              bgmPlayer = player
                          } else {
                              players[name] = player
                          }
                      } catch { print("Audio error: \(error)") }
                  }
                  bgmPlayer?.play()
              }

              func play(_ sound: String) {
                  guard let p = players[sound] else { return }
                  p.volume = UserDefaults.standard.soundVolume
                  p.currentTime = 0
                  p.play()
              }

              func updateVolume(_ vol: Float) {
                  bgmPlayer?.volume = vol
                  players.values.forEach { $0.volume = vol }
              }

              func stopBGM() { bgmPlayer?.stop() }
              func startBGM() { bgmPlayer?.play() }
          }
          SWIFT_EOF

# ============================================================================
#  PS5 JOYSTICK VIEW
# ============================================================================
      - name: JoystickView.swift
        run: |
          cat > InfinityRun/Sources/JoystickView.swift << 'SWIFT_EOF'
          import UIKit

          class JoystickView: UIView {
              private let ring = UIView()
              private let knob = UIView()
              let radius: CGFloat
              var velocity: SIMD2<Float> = .zero
              var isActive = false
              var jumpTriggered = false
              weak var trackingTouch: UITouch?

              init(radius: CGFloat) {
                  self.radius = radius
                  super.init(frame: CGRect(x: 0, y: 0, width: radius*2, height: radius*2))
                  isUserInteractionEnabled = false
                  alpha = 0.78

                  ring.frame = bounds
                  ring.layer.cornerRadius = radius
                  ring.backgroundColor = UIColor(white: 1, alpha: 0.07)
                  ring.layer.borderColor = UIColor(white: 1, alpha: 0.26).cgColor
                  ring.layer.borderWidth = 2
                  addSubview(ring)

                  let kR = radius * 0.38
                  knob.frame = CGRect(x: radius - kR, y: radius - kR, width: kR*2, height: kR*2)
                  knob.layer.cornerRadius = kR
                  knob.backgroundColor = UIColor(white: 1, alpha: 0.32)
                  knob.layer.borderColor = UIColor(white: 1, alpha: 0.5).cgColor
                  knob.layer.borderWidth = 1.5
                  addSubview(knob)
              }
              required init?(coder: NSCoder) { fatalError() }

              func moveTouch(_ touch: UITouch, in parent: UIView) {
                  let pt = touch.location(in: parent)
                  let cx = frame.midX, cy = frame.midY
                  let dx = Float(pt.x - cx), dy = Float(pt.y - cy)
                  let dist = sqrt(dx*dx + dy*dy)
                  let maxD = Float(radius)
                  let f = dist <= maxD ? 1.0 : maxD/dist
                  knob.center = CGPoint(x: cx + CGFloat(dx * f), y: cy + CGFloat(dy * f))
                  velocity = SIMD2<Float>(dx * f / maxD, dy * f / maxD)
                  isActive = dist > maxD * 0.12
                  jumpTriggered = (dy < -0.6 * maxD)
              }

              func reset() {
                  knob.center = CGPoint(x: radius, y: radius)
                  velocity = .zero
                  isActive = false
                  jumpTriggered = false
                  trackingTouch = nil
              }
          }
          SWIFT_EOF

# ============================================================================
#  3D CHARACTER NODE (PROCEDURAL ANIMATION)
# ============================================================================
      - name: CharacterNode.swift
        run: |
          cat > InfinityRun/Sources/CharacterNode.swift << 'SWIFT_EOF'
          import SceneKit

          class CharacterNode: SCNNode {
              private var bodyNode: SCNNode!
              private var leftLeg: SCNNode!
              private var rightLeg: SCNNode!
              private var leftArm: SCNNode!
              private var rightArm: SCNNode!
              private var animTime: Float = 0
              private let skin: CharacterSkin

              init(skin: CharacterSkin) {
                  self.skin = skin
                  super.init()
                  build()
              }
              required init?(coder: NSCoder) { fatalError() }

              private func build() {
                  bodyNode = SCNNode()
                  addChildNode(bodyNode)

                  let torso = SCNNode(geometry: box(0.55, 0.75, 0.35, color: skin.bodyColor))
                  torso.position.y = 0.3
                  bodyNode.addChildNode(torso)

                  let head = SCNNode(geometry: SCNSphere(radius: 0.18))
                  head.geometry?.materials = [mat(color: skin.headColor)]
                  head.position.y = 0.78
                  bodyNode.addChildNode(head)

                  let legGeo = SCNCylinder(radius: 0.10, height: 0.65)
                  legGeo.materials = [mat(color: skin.legsColor)]
                  leftLeg = SCNNode(geometry: legGeo)
                  leftLeg.pivot = SCNMatrix4MakeTranslation(0, 0.325, 0)
                  leftLeg.position = SCNVector3(-0.16, 0, 0)
                  bodyNode.addChildNode(leftLeg)

                  rightLeg = SCNNode(geometry: legGeo)
                  rightLeg.pivot = SCNMatrix4MakeTranslation(0, 0.325, 0)
                  rightLeg.position = SCNVector3(0.16, 0, 0)
                  bodyNode.addChildNode(rightLeg)

                  let armGeo = SCNCylinder(radius: 0.08, height: 0.60)
                  armGeo.materials = [mat(color: skin.bodyColor)]
                  leftArm = SCNNode(geometry: armGeo)
                  leftArm.pivot = SCNMatrix4MakeTranslation(0, 0.30, 0)
                  leftArm.position = SCNVector3(-0.36, 0.45, 0)
                  bodyNode.addChildNode(leftArm)

                  rightArm = SCNNode(geometry: armGeo)
                  rightArm.pivot = SCNMatrix4MakeTranslation(0, 0.30, 0)
                  rightArm.position = SCNVector3(0.36, 0.45, 0)
                  bodyNode.addChildNode(rightArm)
              }

              private func box(_ w: Float, _ h: Float, _ d: Float, color: UIColor) -> SCNGeometry {
                  let geo = SCNBox(width: CGFloat(w), height: CGFloat(h), length: CGFloat(d), chamferRadius: 0.06)
                  geo.materials = [mat(color: color)]
                  return geo
              }

              private func mat(color: UIColor) -> SCNMaterial {
                  let m = SCNMaterial()
                  m.diffuse.contents = color
                  m.lightingModel = .lambert
                  return m
              }

              func updateAnimation(dt: Float, speed: Float, isGrounded: Bool) {
                  if !isGrounded {
                      leftLeg.eulerAngles.x = 0
                      rightLeg.eulerAngles.x = 0
                      leftArm.eulerAngles.x = -1.2
                      rightArm.eulerAngles.x = 1.2
                      animTime = 0
                      return
                  }
                  if speed > 0.1 {
                      animTime += dt * speed * 10
                      let angle = sin(animTime) * 0.5
                      leftLeg.eulerAngles.x = angle
                      rightLeg.eulerAngles.x = -angle
                      leftArm.eulerAngles.x = -angle * 0.6
                      rightArm.eulerAngles.x = angle * 0.6
                  } else {
                      leftLeg.eulerAngles.x = 0; rightLeg.eulerAngles.x = 0
                      leftArm.eulerAngles.x = 0; rightArm.eulerAngles.x = 0
                      animTime = 0
                  }
              }

              func updateJump(progress: Float) {
                  position.y = sin(progress * .pi) * 2.0
                  if progress < 0.5 {
                      leftArm.eulerAngles.x = -1.6; rightArm.eulerAngles.x = 1.6
                  } else {
                      leftArm.eulerAngles.x = -0.2; rightArm.eulerAngles.x = 0.2
                  }
              }
          }
          SWIFT_EOF

# ============================================================================
#  INFINITE ROAD & ENVIRONMENT GENERATOR
# ============================================================================
      - name: RoadManager.swift
        run: |
          cat > InfinityRun/Sources/RoadManager.swift << 'SWIFT_EOF'
          import SceneKit

          class RoadManager {
              private weak var scene: SCNScene?
              private let segLen: Float = 30
              private let lanes = 3
              private let laneW: Float = 3.2
              private var activeNodes: [SCNNode] = []
              private var lastZ: Float = 0

              init(scene: SCNScene) {
                  self.scene = scene
                  for i in -3..<8 { addSegment(at: Float(i) * segLen) }
              }

              private func addSegment(at z: Float) {
                  guard let scene = scene else { return }
                  let road = SCNNode(geometry: SCNBox(width: CGFloat(laneW*Float(lanes)), height: 0.15, length: CGFloat(segLen), chamferRadius: 0))
                  road.geometry?.materials = [mat(0.12,0.12,0.12)]
                  road.position = SCNVector3(0, -0.15, z + segLen/2)
                  scene.rootNode.addChildNode(road)
                  activeNodes.append(road)

                  for l in -1...1 where l != 0 {
                      let line = SCNNode(geometry: SCNBox(width: 0.08, height: 0.05, length: CGFloat(segLen), chamferRadius: 0))
                      line.geometry?.materials = [mat(1,1,1)]
                      line.position = SCNVector3(Float(l)*laneW, 0.02, z + segLen/2)
                      scene.rootNode.addChildNode(line)
                      activeNodes.append(line)
                  }

                  let sideX = (laneW * Float(lanes))/2 + 1.5
                  for side: Float in [-1, 1] {
                      if Float.random(in: 0...1) > 0.4 {
                          let tree = buildTree()
                          tree.position = SCNVector3(side * (sideX + Float.random(in: 0...1.5)), 0, z + Float.random(in: 0..<segLen))
                          scene.rootNode.addChildNode(tree)
                          activeNodes.append(tree)
                      }
                      if Float.random(in: 0...1) > 0.6 {
                          let building = buildBuilding()
                          building.position = SCNVector3(side * (sideX + Float.random(in: 1...3)), 0, z + Float.random(in: 0..<segLen))
                          scene.rootNode.addChildNode(building)
                          activeNodes.append(building)
                      }
                  }
                  lastZ = z + segLen
              }

              private func buildTree() -> SCNNode {
                  let trunk = SCNNode(geometry: SCNCylinder(radius: 0.2, height: 2.0))
                  trunk.geometry?.materials = [mat(0.4,0.2,0.1)]
                  trunk.position.y = 1.0
                  let leaves = SCNNode(geometry: SCNSphere(radius: 0.9))
                  leaves.geometry?.materials = [mat(0.1,0.3,0.1)]
                  leaves.position.y = 2.6
                  let tree = SCNNode()
                  tree.addChildNode(trunk)
                  tree.addChildNode(leaves)
                  return tree
              }

              private func buildBuilding() -> SCNNode {
                  let h = Float.random(in: 3...8)
                  let w = Float.random(in: 2...4)
                  let box = SCNNode(geometry: SCNBox(width: CGFloat(w), height: CGFloat(h), length: CGFloat(w), chamferRadius: 0.1))
                  box.geometry?.materials = [mat(0.15,0.12,0.08)]
                  box.position.y = h/2
                  return box
              }

              private func mat(_ r: Float, _ g: Float, _ b: Float) -> SCNMaterial {
                  let m = SCNMaterial()
                  m.diffuse.contents = UIColor(red: CGFloat(r), green: CGFloat(g), blue: CGFloat(b), alpha: 1)
                  m.lightingModel = .lambert
                  return m
              }

              func update(playerZ: Float) {
                  let threshold = playerZ - segLen * 2
                  while let first = activeNodes.first, first.position.z < threshold {
                      first.removeFromParentNode()
                      activeNodes.removeFirst()
                  }
                  while lastZ - playerZ < segLen * 6 {
                      addSegment(at: lastZ)
                  }
              }
          }
          SWIFT_EOF

# ============================================================================
#  HUD (SCORE, COINS, PAUSE BUTTON)
# ============================================================================
      - name: HUD.swift
        run: |
          cat > InfinityRun/Sources/HUD.swift << 'SWIFT_EOF'
          import UIKit

          class GameHUD: UIView {
              private let scoreLabel = UILabel()
              private let coinsLabel = UILabel()
              private let distanceLabel = UILabel()
              let pauseButton = UIButton(type: .system)

              override init(frame: CGRect) {
                  super.init(frame: frame)
                  isUserInteractionEnabled = true
                  backgroundColor = .clear

                  coinsLabel.frame = CGRect(x: 20, y: 20, width: 200, height: 30)
                  coinsLabel.textColor = UIColor(red: 1, green: 0.85, blue: 0.2, alpha: 1)
                  coinsLabel.font = UIFont(name: "Courier-Bold", size: 20) ?? .boldSystemFont(ofSize: 20)
                  addSubview(coinsLabel)

                  distanceLabel.frame = CGRect(x: 0, y: 20, width: bounds.width, height: 30)
                  distanceLabel.autoresizingMask = [.flexibleWidth]
                  distanceLabel.textAlignment = .center
                  distanceLabel.textColor = .white
                  distanceLabel.font = UIFont(name: "Courier-Bold", size: 22) ?? .boldSystemFont(ofSize: 22)
                  addSubview(distanceLabel)

                  scoreLabel.frame = CGRect(x: 0, y: 55, width: bounds.width - 20, height: 26)
                  scoreLabel.autoresizingMask = [.flexibleWidth]
                  scoreLabel.textAlignment = .right
                  scoreLabel.textColor = UIColor(red: 1, green: 0.9, blue: 0.2, alpha: 1)
                  scoreLabel.font = UIFont(name: "Courier-Bold", size: 18) ?? .boldSystemFont(ofSize: 18)
                  addSubview(scoreLabel)

                  pauseButton.frame = CGRect(x: bounds.width - 80, y: bounds.height - 70, width: 60, height: 60)
                  pauseButton.autoresizingMask = [.flexibleLeftMargin, .flexibleTopMargin]
                  pauseButton.setTitle("⏸", for: .normal)
                  pauseButton.titleLabel?.font = UIFont.systemFont(ofSize: 36)
                  pauseButton.tintColor = .white
                  addSubview(pauseButton)
              }
              required init?(coder: NSCoder) { fatalError() }

              func update(coins: Int, distance: Int, score: Int) {
                  coinsLabel.text = "🪙 \(coins)"
                  distanceLabel.text = "\(distance) m"
                  scoreLabel.text = "SCORE: \(score)"
              }
          }
          SWIFT_EOF

# ============================================================================
#  MAIN MENU (START, SETTINGS, 3D PREVIEW)
# ============================================================================
      - name: MainMenuViewController.swift
        run: |
          cat > InfinityRun/Sources/MainMenuViewController.swift << 'SWIFT_EOF'
          import UIKit
          import SceneKit

          class MainMenuViewController: UIViewController {
              private var scnView: SCNView!

              override func viewDidLoad() {
                  super.viewDidLoad()

                  scnView = SCNView(frame: view.bounds)
                  scnView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  view.addSubview(scnView)

                  let scene = SCNScene()
                  scene.background.contents = UIColor(red: 0.08, green: 0.07, blue: 0.15, alpha: 1)
                  scnView.scene = scene
                  scnView.autoenablesDefaultLighting = true
                  scnView.allowsCameraControl = true

                  let char = CharacterNode(skin: UserDefaults.standard.selectedSkin)
                  char.position = SCNVector3(0, 0, 0)
                  scene.rootNode.addChildNode(char)
                  char.runAction(SCNAction.repeatForever(SCNAction.rotateBy(x: 0, y: .pi*2, z: 0, duration: 10)))

                  let cam = SCNNode()
                  cam.camera = SCNCamera()
                  cam.position = SCNVector3(0, 1.8, 5)
                  cam.eulerAngles = SCNVector3(-0.15, 0, 0)
                  scene.rootNode.addChildNode(cam)

                  let title = UILabel()
                  title.text = "INFINITY RUN 3D"
                  title.font = UIFont(name: "Courier-Bold", size: 36) ?? .boldSystemFont(ofSize: 36)
                  title.textColor = UIColor(red: 1, green: 0.8, blue: 0.1, alpha: 1)
                  title.textAlignment = .center
                  title.frame = CGRect(x: 0, y: 80, width: view.bounds.width, height: 60)
                  view.addSubview(title)

                  let start = menuButton("▶ START", y: view.bounds.height*0.55)
                  start.addTarget(self, action: #selector(startGame), for: .touchUpInside)
                  view.addSubview(start)

                  let settings = menuButton("⚙ SETTINGS", y: view.bounds.height*0.68)
                  settings.addTarget(self, action: #selector(openSettings), for: .touchUpInside)
                  view.addSubview(settings)

                  AudioManager.shared.preload()
              }

              private func menuButton(_ title: String, y: CGFloat) -> UIButton {
                  let btn = UIButton(type: .custom)
                  btn.frame = CGRect(x: (view.bounds.width-220)/2, y: y, width: 220, height: 52)
                  btn.setTitle(title, for: .normal)
                  btn.titleLabel?.font = UIFont(name: "Courier-Bold", size: 22) ?? .boldSystemFont(ofSize: 22)
                  btn.backgroundColor = UIColor(red: 0.6, green: 0, blue: 0, alpha: 0.85)
                  btn.layer.cornerRadius = 14
                  btn.layer.borderColor = UIColor(red: 1, green: 0.2, blue: 0.2, alpha: 1).cgColor
                  btn.layer.borderWidth = 2
                  return btn
              }

              @objc private func startGame() {
                  let gameVC = GameViewController()
                  gameVC.modalPresentationStyle = .fullScreen
                  present(gameVC, animated: true)
              }

              @objc private func openSettings() {
                  let vc = SettingsViewController()
                  vc.modalPresentationStyle = .fullScreen
                  present(vc, animated: true)
              }

              override var prefersStatusBarHidden: Bool { true }
          }
          SWIFT_EOF

# ============================================================================
#  SETTINGS PAGE (CHARACTER SELECTION & VOLUME)
# ============================================================================
      - name: SettingsViewController.swift
        run: |
          cat > InfinityRun/Sources/SettingsViewController.swift << 'SWIFT_EOF'
          import UIKit
          import SceneKit

          class SettingsViewController: UIViewController {
              private var previewView: SCNView!
              private var charNode: CharacterNode!
              private let segment = UISegmentedControl(items: CharacterSkin.allCases.map{$0.rawValue})
              private let volumeSlider = UISlider()

              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = UIColor(red: 0.05, green: 0.05, blue: 0.1, alpha: 1)

                  previewView = SCNView(frame: CGRect(x: 0, y: 100, width: view.bounds.width, height: 260))
                  previewView.backgroundColor = .clear
                  let scene = SCNScene()
                  scene.background.contents = UIColor.clear
                  previewView.scene = scene
                  previewView.autoenablesDefaultLighting = true
                  previewView.allowsCameraControl = true
                  view.addSubview(previewView)

                  let cam = SCNNode()
                  cam.camera = SCNCamera()
                  cam.position = SCNVector3(0, 1.5, 3)
                  scene.rootNode.addChildNode(cam)

                  charNode = CharacterNode(skin: UserDefaults.standard.selectedSkin)
                  charNode.position = SCNVector3(0, 0, 0)
                  scene.rootNode.addChildNode(charNode)

                  segment.frame = CGRect(x: 30, y: 380, width: view.bounds.width-60, height: 40)
                  segment.selectedSegmentIndex = CharacterSkin.allCases.firstIndex(of: UserDefaults.standard.selectedSkin) ?? 0
                  segment.addTarget(self, action: #selector(skinChanged), for: .valueChanged)
                  view.addSubview(segment)

                  let volLabel = UILabel(frame: CGRect(x: 30, y: 450, width: 100, height: 30))
                  volLabel.text = "🔊 Volume"
                  volLabel.textColor = .white
                  volLabel.font = .systemFont(ofSize: 18, weight: .bold)
                  view.addSubview(volLabel)

                  volumeSlider.frame = CGRect(x: 30, y: 480, width: view.bounds.width-60, height: 30)
                  volumeSlider.value = UserDefaults.standard.soundVolume
                  volumeSlider.addTarget(self, action: #selector(volumeChanged), for: .valueChanged)
                  view.addSubview(volumeSlider)

                  let backBtn = UIButton(type: .system)
                  backBtn.frame = CGRect(x: 30, y: 550, width: 120, height: 44)
                  backBtn.setTitle("← BACK", for: .normal)
                  backBtn.titleLabel?.font = .boldSystemFont(ofSize: 18)
                  backBtn.setTitleColor(.white, for: .normal)
                  backBtn.backgroundColor = UIColor(red: 0.3, green: 0.3, blue: 0.3, alpha: 0.8)
                  backBtn.layer.cornerRadius = 8
                  backBtn.addTarget(self, action: #selector(goBack), for: .touchUpInside)
                  view.addSubview(backBtn)
              }

              @objc private func skinChanged() {
                  let newSkin = CharacterSkin.allCases[segment.selectedSegmentIndex]
                  UserDefaults.standard.selectedSkin = newSkin
                  charNode.removeFromParentNode()
                  charNode = CharacterNode(skin: newSkin)
                  charNode.position = SCNVector3(0, 0, 0)
                  previewView.scene?.rootNode.addChildNode(charNode)
              }

              @objc private func volumeChanged() {
                  UserDefaults.standard.soundVolume = volumeSlider.value
                  AudioManager.shared.updateVolume(volumeSlider.value)
              }

              @objc private func goBack() { dismiss(animated: true) }
              override var prefersStatusBarHidden: Bool { true }
          }
          SWIFT_EOF

# ============================================================================
#  GAME VIEW CONTROLLER (FIXED)
# ============================================================================
      - name: GameViewController.swift
        run: |
          cat > InfinityRun/Sources/GameViewController.swift << 'SWIFT_EOF'
          import UIKit
          import SceneKit

          class GameViewController: UIViewController, SCNSceneRendererDelegate {
              private var scnView: SCNView!
              private var scene: SCNScene!
              private var player: CharacterNode!
              private var cameraNode: SCNNode!
              private var roadManager: RoadManager!
              private var joystick: JoystickView!
              private var hud: GameHUD!

              // State
              private var playerX: Float = 0
              private var playerZ: Float = 0
              private var speed: Float = 6.0
              private var coins = 0
              private var score = 0
              private var distance: Int { Int(playerZ) }
              private var isJumping = false
              private var jumpTimer: Float = 0
              private let jumpDuration: Float = 0.7
              private var isGameOver = false
              private var paused = false
              private var lastTime: TimeInterval = 0

              private var obstacles: [SCNNode] = []
              private var coinNodes: [SCNNode] = []
              private var powerUps: [SCNNode] = []
              private var spawnTimer: Float = 0
              private let baseSpawnInterval: Float = 1.8
              private var spawnInterval: Float = 1.8

              override func viewDidLoad() {
                  super.viewDidLoad()
                  setupScene()
                  setupPlayer()
                  setupCamera()
                  roadManager = RoadManager(scene: scene)
                  setupJoystick()
                  setupHUD()
                  scnView.delegate = self
                  scnView.isPlaying = true
              }

              private func setupScene() {
                  scnView = SCNView(frame: view.bounds)
                  scnView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  scnView.backgroundColor = UIColor(red: 0.05, green: 0.06, blue: 0.12, alpha: 1)
                  scnView.antialiasingMode = .multisampling4X
                  view.addSubview(scnView)

                  scene = SCNScene()
                  scene.fogColor = UIColor(red: 0.12, green: 0.13, blue: 0.18, alpha: 1)
                  scene.fogStartDistance = 30
                  scene.fogEndDistance = 100
                  scene.fogDensityExponent = 0.7
                  scnView.scene = scene

                  let ambient = SCNNode()
                  ambient.light = SCNLight()
                  ambient.light?.type = .ambient
                  ambient.light?.color = UIColor(white: 0.4, alpha: 1)
                  scene.rootNode.addChildNode(ambient)
              }

              private func setupPlayer() {
                  player = CharacterNode(skin: UserDefaults.standard.selectedSkin)
                  player.position = SCNVector3(0, 0, 0)
                  scene.rootNode.addChildNode(player)
              }

              private func setupCamera() {
                  cameraNode = SCNNode()
                  cameraNode.camera = SCNCamera()
                  cameraNode.camera?.fieldOfView = 80
                  cameraNode.position = SCNVector3(0, 2.5, 5.5)
                  cameraNode.eulerAngles = SCNVector3(-0.2, 0, 0)
                  scene.rootNode.addChildNode(cameraNode)
              }

              private func setupJoystick() {
                  let jR = view.bounds.height * 0.16
                  joystick = JoystickView(radius: jR)
                  joystick.center = CGPoint(x: jR + 30, y: view.bounds.height - jR - 30)
                  view.addSubview(joystick)
              }

              private func setupHUD() {
                  hud = GameHUD(frame: view.bounds)
                  view.addSubview(hud)
                  hud.pauseButton.addTarget(self, action: #selector(togglePause), for: .touchUpInside)
              }

              @objc private func togglePause() {
                  paused.toggle()
                  scnView.isPlaying = !paused
                  if paused {
                      AudioManager.shared.stopBGM()
                      let alert = UIAlertController(title: "Paused", message: nil, preferredStyle: .alert)
                      alert.addAction(UIAlertAction(title: "Resume", style: .default) { [weak self] _ in
                          self?.paused = false
                          self?.scnView.isPlaying = true
                          AudioManager.shared.startBGM()
                      })
                      alert.addAction(UIAlertAction(title: "Quit", style: .destructive) { [weak self] _ in
                          self?.dismiss(animated: true)
                      })
                      present(alert, animated: true)
                  }
              }

              // Touch
              override func touchesBegan(_ touches: Set<UITouch>, with event: UIEvent?) {
                  for t in touches {
                      let pt = t.location(in: view)
                      if joystick.frame.contains(pt) && joystick.trackingTouch == nil {
                          joystick.trackingTouch = t
                      }
                  }
              }
              override func touchesMoved(_ touches: Set<UITouch>, with event: UIEvent?) {
                  for t in touches where t === joystick.trackingTouch {
                      joystick.moveTouch(t, in: view)
                  }
              }
              override func touchesEnded(_ touches: Set<UITouch>, with event: UIEvent?) {
                  for t in touches where t === joystick.trackingTouch { joystick.reset() }
              }
              override func touchesCancelled(_ touches: Set<UITouch>, with event: UIEvent?) {
                  touchesEnded(touches, with: event)
              }

              // Game loop
              func renderer(_ renderer: SCNSceneRenderer, updateAtTime time: TimeInterval) {
                  guard !isGameOver && !paused else { return }
                  let dt = lastTime == 0 ? 0.016 : Float(min(time - lastTime, 0.05))
                  lastTime = time

                  handleInput(dt: dt)
                  updatePlayer(dt: dt)
                  updateCollisions()
                  spawnItems(dt: dt)
                  roadManager.update(playerZ: playerZ)
                  updateCamera(dt: dt)
                  speed += dt * 0.2   // gradually faster

                  DispatchQueue.main.async {
                      self.hud.update(coins: self.coins, distance: self.distance, score: self.score)
                  }
              }

              private func handleInput(dt: Float) {
                  let vel = joystick.velocity
                  let targetX = playerX + vel.x * 10 * dt
                  playerX = max(-4.5, min(4.5, targetX))

                  if joystick.jumpTriggered && !isJumping {
                      isJumping = true
                      jumpTimer = 0
                      AudioManager.shared.play("jump")
                      joystick.jumpTriggered = false
                  }
              }

              private func updatePlayer(dt: Float) {
                  playerZ += speed * dt

                  if isJumping {
                      jumpTimer += dt
                      let progress = jumpTimer / jumpDuration
                      if progress >= 1.0 {
                          isJumping = false
                          player.updateAnimation(dt: dt, speed: speed, isGrounded: true)
                          player.position.y = 0
                      } else {
                          player.updateJump(progress: progress)
                      }
                  } else {
                      player.updateAnimation(dt: dt, speed: speed, isGrounded: true)
                      player.position.y = 0
                  }

                  player.position.x = playerX
                  player.position.z = playerZ
                  score = Int(playerZ)
              }

              private func updateCamera(dt: Float) {
                  cameraNode.position = SCNVector3(playerX, 2.5, playerZ + 5.5)
              }

              private func spawnItems(dt: Float) {
                  spawnTimer += dt
                  spawnInterval = max(0.6, baseSpawnInterval - speed * 0.05)
                  if spawnTimer >= spawnInterval {
                      spawnTimer = 0
                      let lane = Float(Int.random(in: -1...1)) * 3.1
                      let z = playerZ + 35 + Float.random(in: 0...10)

                      let r = Float.random(in: 0...1)
                      if r < 0.3 {
                          // obstacle
                          let type = ObstacleType.allCases.randomElement()!
                          let h = type.height
                          let obs = SCNNode(geometry: SCNBox(width: 1.0, height: CGFloat(h), length: 0.4, chamferRadius: 0.05))
                          let mat = SCNMaterial()
                          mat.diffuse.contents = UIColor.red
                          obs.geometry?.materials = [mat]
                          obs.position = SCNVector3(lane, h/2, z)
                          scene.rootNode.addChildNode(obs)
                          obstacles.append(obs)
                      } else if r < 0.7 {
                          // coin
                          let coin = SCNNode(geometry: SCNSphere(radius: 0.3))
                          coin.geometry?.materials = [matFromColor(.yellow)]
                          coin.position = SCNVector3(lane, 0.6, z)
                          scene.rootNode.addChildNode(coin)
                          coinNodes.append(coin)
                      } else {
                          // power-up
                          let puType = PowerUpType.allCases.randomElement()!
                          let puGeo: SCNGeometry
                          let puColor: UIColor
                          switch puType {
                          case .magnet: puGeo = SCNCylinder(radius: 0.4, height: 0.6); puColor = .blue
                          case .shield: puGeo = SCNBox(width: 0.6, height: 0.6, length: 0.6, chamferRadius: 0.1); puColor = .green
                          case .speedBoost: puGeo = SCNSphere(radius: 0.4); puColor = .yellow
                          }
                          puGeo.materials = [matFromColor(puColor)]
                          let pu = SCNNode(geometry: puGeo)
                          pu.position = SCNVector3(lane, 0.8, z)
                          scene.rootNode.addChildNode(pu)
                          powerUps.append(pu)
                      }
                  }
              }

              private func updateCollisions() {
                  // Collect coins
                  var collected: [SCNNode] = []
                  for coin in coinNodes {
                      let dx = abs(coin.position.x - playerX)
                      let dz = coin.position.z - playerZ
                      if dz > -0.8 && dz < 0.8 && dx < 0.7 {
                          collected.append(coin)
                          coin.removeFromParentNode()
                          coins += 1
                          score += 10
                          AudioManager.shared.play("coin")
                      }
                  }
                  coinNodes.removeAll(where: { collected.contains($0) })

                  // Obstacles
                  var hitObstacles: [SCNNode] = []
                  for obs in obstacles {
                      let dx = abs(obs.position.x - playerX)
                      let dz = obs.position.z - playerZ
                      if dz > -0.9 && dz < 0.9 && dx < 0.7 {
                          hitObstacles.append(obs)
                      }
                  }
                  obstacles.removeAll(where: { hitObstacles.contains($0) })
                  if !hitObstacles.isEmpty {
                      gameOver(reason: "hit")
                  }

                  // Power-ups
                  var activated: [SCNNode] = []
                  for pu in powerUps {
                      let dx = abs(pu.position.x - playerX)
                      let dz = pu.position.z - playerZ
                      if dz > -0.8 && dz < 0.8 && dx < 0.7 {
                          activated.append(pu)
                          pu.removeFromParentNode()
                          AudioManager.shared.play("powerup")
                          score += 50
                      }
                  }
                  powerUps.removeAll(where: { activated.contains($0) })

                  // Remove far objects
                  let farZ = playerZ - 30
                  obstacles.removeAll(where: { if $0.position.z < farZ { $0.removeFromParentNode(); return true }; return false })
                  coinNodes.removeAll(where: { if $0.position.z < farZ { $0.removeFromParentNode(); return true }; return false })
                  powerUps.removeAll(where: { if $0.position.z < farZ { $0.removeFromParentNode(); return true }; return false })
              }

              private func gameOver(reason: String) {
                  isGameOver = true
                  AudioManager.shared.play("hit")
                  AudioManager.shared.stopBGM()
                  let alert = UIAlertController(title: "GAME OVER", message: "Distance: \(distance) m\nCoins: \(coins)\nScore: \(score)", preferredStyle: .alert)
                  alert.addAction(UIAlertAction(title: "Restart", style: .default) { [weak self] _ in
                      self?.dismiss(animated: false)
                  })
                  alert.addAction(UIAlertAction(title: "Menu", style: .cancel) { [weak self] _ in
                      self?.dismiss(animated: true)
                  })
                  present(alert, animated: true)
              }

              // Helper to create material from a UIColor (works without .components)
              private func matFromColor(_ color: UIColor) -> SCNMaterial {
                  let m = SCNMaterial()
                  m.diffuse.contents = color
                  m.lightingModel = .lambert
                  return m
              }

              override var prefersStatusBarHidden: Bool { true }
              override var supportedInterfaceOrientations: UIInterfaceOrientationMask { .landscape }
          }
          SWIFT_EOF

# ============================================================================
#  PROJECT.YML
# ============================================================================
      - name: project.yml
        run: |
          cat > InfinityRun/project.yml << 'YAML_EOF'
