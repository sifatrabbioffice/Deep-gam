      # ── AppIcon ──────────────────────────────────────────────────────────────
      - name: Generate AppIcon
        run: |
          cat > InfiniteRoad/Resources/Assets.xcassets/AppIcon.appiconset/Contents.json << 'JSON_EOF'
          {
            "images":[{"idiom":"universal","platform":"ios","size":"1024x1024", "filename":"icon.png","scale":"1x"}],
            "info":{"author":"xcode","version":1}
          }
          JSON_EOF
          cat > InfiniteRoad/Resources/Assets.xcassets/Contents.json << 'JSON_EOF'
          {"info":{"author":"xcode","version":1}}
          JSON_EOF
          python3 - << 'PYEOF'
          import struct, zlib, math
          def png(w, h):
              def u32(n): return struct.pack('>I', n)
              def chunk(t, d): return u32(len(d)) + t + d + u32(zlib.crc32(t+d) & 0xffffffff)
              rows = []
              for y in range(h):
                  row = [0]
                  for x in range(w):
                      cx, cy = x - w//2, y - h//2
                      road = abs(cy) < 0.1 * h  # road stripe
                      if road:
                          r, g, b = 40, 40, 40
                      else:
                          r, g, b = 10, 5, 20
                      row += [min(255,r), min(255,g), min(255,b)]
                  rows.append(bytes(row))
              raw  = zlib.compress(b''.join(rows), 9)
              sig  = b'\x89PNG\r\n\x1a\n'
              ihdr = u32(w) + u32(h) + bytes([8, 2, 0, 0, 0])
              return sig + chunk(b'IHDR', ihdr) + chunk(b'IDAT', raw) + chunk(b'IEND', b'')
          with open('InfiniteRoad/Resources/Assets.xcassets/AppIcon.appiconset/icon.png', 'wb') as f:
              f.write(png(1024, 1024))
          print("Icon OK")
          PYEOF

      # ── Generate Sounds ──────────────────────────────────────────────────────
      - name: Generate Sounds
        run: |
          python3 << 'PYEOF'
          import struct, wave, math, os

          def wav_file(path, freq, duration, volume=0.5, sample_rate=44100):
              n_samples = int(sample_rate * duration)
              data = []
              for i in range(n_samples):
                  t = float(i) / sample_rate
                  val = int(volume * 32767.0 * math.sin(2.0 * math.pi * freq * t))
                  data.append(struct.pack('<h', val))
              raw = b''.join(data)
              with wave.open(path, 'w') as wf:
                  wf.setnchannels(1)
                  wf.setsampwidth(2)
                  wf.setframerate(sample_rate)
                  wf.writeframes(raw)

          sounds_dir = 'InfiniteRoad/Resources/Sounds'
          os.makedirs(sounds_dir, exist_ok=True)

          # coin sound
          wav_file(os.path.join(sounds_dir, 'coin.wav'), 880, 0.15)
          # jump sound
          wav_file(os.path.join(sounds_dir, 'jump.wav'), 440, 0.2)
          # hit sound
          wav_file(os.path.join(sounds_dir, 'hit.wav'), 220, 0.5, volume=0.8)
          # background music: simple arpeggio loop
          bgm_path = os.path.join(sounds_dir, 'bgm.wav')
          sample_rate = 22050
          duration = 3.0
          n_samples = int(sample_rate * duration)
          bgm_data = []
          notes = [261.63, 329.63, 392.00, 523.25]  # C E G C
          for i in range(n_samples):
              t = float(i) / sample_rate
              note_idx = (i // (sample_rate // 4)) % len(notes)
              freq = notes[note_idx]
              val = int(0.3 * 32767.0 * math.sin(2.0 * math.pi * freq * t))
              bgm_data.append(struct.pack('<h', val))
          raw_bgm = b''.join(bgm_data)
          with wave.open(bgm_path, 'w') as wf:
              wf.setnchannels(1)
              wf.setsampwidth(2)
              wf.setframerate(sample_rate)
              wf.writeframes(raw_bgm)
          print("✅ Sounds generated")
          PYEOF

      # ── XcodeGen ─────────────────────────────────────────────────────────────
      - name: Generate Xcode Project
        working-directory: InfiniteRoad
        run: xcodegen generate --spec project.yml --project .

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project InfiniteRoad/InfiniteRoadRunner.xcodeproj \
            -scheme InfiniteRoadRunner \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            SWIFT_VERSION=5.9 \
            OBJROOT="${{ github.workspace }}/build/obj" \
            SYMROOT="${{ github.workspace }}/build/sym" \
            clean build 2>&1 | tee build.log | xcpretty || \
            (echo "=== BUILD ERRORS ===" && grep "error:" build.log | head -30 && exit 1)

      # ── Package IPA ──────────────────────────────────────────────────────────
      - name: Package IPA
        run: |
          APP=$(find "${{ github.workspace }}/build/sym" -name "InfiniteRoadRunner.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "❌ .app not found"
            grep "error:" build.log | head -20
            exit 1
          fi
          echo "✅ Found: $APP ($(du -sh "$APP" | cut -f1))"
          mkdir -p Payload
          cp -r "$APP" Payload/InfiniteRoadRunner.app
          rm -rf Payload/InfiniteRoadRunner.app/_CodeSignature 2>/dev/null || true
          zip -r InfiniteRoadRunner.ipa Payload
          echo "📦 IPA: $(du -sh InfiniteRoadRunner.ipa | cut -f1)"

      # ── Upload ───────────────────────────────────────────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: InfiniteRoadRunner-iPhone
          path: InfiniteRoadRunner.ipa
          retention-days: 30

