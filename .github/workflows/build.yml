              private func setupHUD() {
                  hudView = HUDOverlay(frame: view.bounds)
                  hudView.autoresizingMask    = [.flexibleWidth, .flexibleHeight]
                  hudView.isUserInteractionEnabled = true
                  view.addSubview(hudView)
                  hudView.shootBtn.addTarget(self, action: #selector(shootDown), for: .touchDown)
                  hudView.shootBtn.addTarget(self, action: #selector(shootUp), for: [.touchUpInside, .touchUpOutside, .touchCancel])

                  // ⭐ Wire the new restart & environment buttons
                  hudView.restartBtn.addTarget(self, action: #selector(restartLevel), for: .touchUpInside)
                  hudView.envBtn.addTarget(self, action: #selector(cycleEnvironment), for: .touchUpInside)
              }

              @objc private func shootDown() { isShooting = true  }
              @objc private func shootUp()   { isShooting = false }

              private func setupJoysticks() {
                  let jR        = view.bounds.height * 0.14
                  moveJoystick  = JoystickView(radius: jR)
                  moveJoystick.center = CGPoint(x: jR + 28, y: view.bounds.height - jR - 28)
                  view.addSubview(moveJoystick)

                  aimJoystick   = JoystickView(radius: jR)
                  aimJoystick.center = CGPoint(x: view.bounds.width - jR - 28 - 96, y: view.bounds.height - jR - 28)
                  view.addSubview(aimJoystick)
              }

              override func touchesBegan(_ touches: Set<UITouch>, with event: UIEvent?) {
                  for t in touches {
                      let pt = t.location(in: view)
                      if moveJoystick.frame.contains(pt) && moveJoystick.trackingTouch == nil {
                          moveJoystick.trackingTouch = t
                      } else if aimJoystick.frame.contains(pt) && aimJoystick.trackingTouch == nil {
                          aimJoystick.trackingTouch = t
                          aimTouch  = t
                          lastAimPt = pt
                      }
                  }
              }

              override func touchesMoved(_ touches: Set<UITouch>, with event: UIEvent?) {
                  for t in touches {
                      let pt = t.location(in: view)
                      if t === moveJoystick.trackingTouch {
                          moveJoystick.moveTouch(t, in: view)
                      } else if t === aimJoystick.trackingTouch {
                          aimJoystick.moveTouch(t, in: view)
                          cameraYaw -= Float(pt.x - lastAimPt.x) * 0.0055
                          lastAimPt  = pt
                      }
                  }
              }

              override func touchesEnded(_ touches: Set<UITouch>, with event: UIEvent?) {
                  for t in touches {
                      if t === moveJoystick.trackingTouch { moveJoystick.reset() }
                      if t === aimJoystick.trackingTouch  { aimJoystick.reset(); aimTouch = nil }
                  }
              }

              override func touchesCancelled(_ touches: Set<UITouch>, with event: UIEvent?) {
                  touchesEnded(touches, with: event)
              }

              func renderer(_ renderer: SCNSceneRenderer, updateAtTime time: TimeInterval) {
                  guard !isGameOver else { return }
                  let dt = lastTime == 0 ? 0 : Float(min(time - lastTime, 0.05))
                  lastTime = time

                  movePlayer(dt: dt)
                  updateCamera()
                  if isShooting { tryShoot(time: time) }
                  updateEnemies(time: time, dt: dt)
                  updateWaves(dt: dt)
                  cleanBullets()

                  DispatchQueue.main.async { [weak self] in
                      guard let s = self else { return }
                      s.hudView.update(health: s.health, maxHealth: s.maxHealth, ammo: s.ammo, totalAmmo: s.totalAmmo, score: s.score, wave: s.wave, isReloading: s.isReloading)
                      if s.health <= 0 && !s.isGameOver { s.endGame(victory: false) }
                  }
              }

              private func movePlayer(dt: Float) {
                  let mv  = moveJoystick.velocity
                  let len = sqrt(mv.x * mv.x + mv.y * mv.y)
                  guard len > 0.1 else {
                      animateCharacterLegsAndArms(isMoving: false, speedFactor: 0, dt: dt)
                      return
                  }
                  let isRunning = len > 0.75
                  let movementSpeed: Float = isRunning ? 7.2 : 3.4
                  let speedFactor: Float = isRunning ? 2.2 : 1.2

                  let fwd = SIMD3<Float>(-sin(cameraYaw), 0, -cos(cameraYaw))
                  let rgt = SIMD3<Float>( cos(cameraYaw), 0, -sin(cameraYaw))
                  var dir = fwd * (-mv.y) + rgt * mv.x
                  let dLen = sqrt(dir.x * dir.x + dir.y * dir.y + dir.z * dir.z)
                  if dLen > 0 { dir = dir / dLen }
                  
                  let mv3 = dir * movementSpeed * dt
                  var np  = playerNode.simdPosition + mv3
                  let b   = mapHalf - 1.5
                  np.x = max(-b, min(b, np.x))
                  np.z = max(-b, min(b, np.z))
                  playerNode.simdPosition = np
                  playerBody.eulerAngles.y = atan2(dir.x, dir.z)

                  animateCharacterLegsAndArms(isMoving: true, speedFactor: speedFactor, dt: dt)
              }

              private func animateCharacterLegsAndArms(isMoving: Bool, speedFactor: Float, dt: Float) {
                  if isMoving {
                      animationTime += dt * speedFactor * 12.0
                      let angle = sin(animationTime) * 0.45
                      let armAngle = sin(animationTime) * 0.35

                      leftLegNode.eulerAngles.x  = angle
                      rightLegNode.eulerAngles.x = -angle
                      leftArmNode.eulerAngles.x  = -armAngle
                      rightArmNode.eulerAngles.x = (sin(animationTime * 0.5) * 0.08) - 0.2 
                  } else {
                      leftLegNode.eulerAngles.x  = 0
                      rightLegNode.eulerAngles.x = 0
                      leftArmNode.eulerAngles.x  = 0
                      rightArmNode.eulerAngles.x = -0.1
                      animationTime = 0
                  }
              }

              private func updateCamera() {
                  cameraArm.eulerAngles.y = cameraYaw
              }

              private func tryShoot(time: TimeInterval) {
                  guard canShoot, !isReloading, time - lastShotTime > 0.22 else {
                      if ammo == 0 && !isReloading { reload() }
                      return
                  }
                  guard ammo > 0 else { reload(); return }
                  lastShotTime = time
                  ammo        -= 1

                  let wt    = cameraNode.presentation.worldTransform
                  let cPos  = SCNVector3(wt.m41, wt.m42, wt.m43)
                  let fLen  = sqrt(wt.m31 * wt.m31 + wt.m32 * wt.m32 + wt.m33 * wt.m33)
                  let fx    = -wt.m31 / fLen
                  let fy    = -wt.m32 / fLen
                  let fz    = -wt.m33 / fLen

                  let bulletGeo = SCNCapsule(capRadius: 0.04, height: 0.35)
                  let bulletMat = SCNMaterial()
                  bulletMat.diffuse.contents  = UIColor(red: 1, green: 0.9, blue: 0.2, alpha: 1)
                  bulletMat.emission.contents = UIColor(red: 1, green: 0.7, blue: 0.1, alpha: 1)
                  bulletMat.lightingModel     = .constant
                  bulletGeo.materials = [bulletMat]

                  let bullet   = SCNNode(geometry: bulletGeo)
                  bullet.name  = "bullet"
                  bullet.position = SCNVector3(cPos.x + fx * 1.5, cPos.y + fy * 1.5, cPos.z + fz * 1.5)

                  let bBody = SCNPhysicsBody(type: .dynamic, shape: SCNPhysicsShape(geometry: SCNCapsule(capRadius: 0.04, height: 0.35), options: nil))
                  bBody.categoryBitMask     = PhysicsMask.bullet
                  bBody.contactTestBitMask  = PhysicsMask.enemy | PhysicsMask.wall
                  bBody.collisionBitMask    = PhysicsMask.none
                  bBody.isAffectedByGravity = false
                  bBody.damping             = 0
                  bBody.velocity = SCNVector3(fx * 55, fy * 55, fz * 55)
                  bullet.physicsBody = bBody

                  scene.rootNode.addChildNode(bullet)
                  bullets.append(bullet)

                  bullet.runAction(SCNAction.sequence([
                      SCNAction.wait(duration: 2.5),
                      SCNAction.run { [weak self] n in self?.bullets.removeAll { $0 === n } },
                      SCNAction.removeFromParentNode()
                  ]))

                  if ammo == 0 { reload() }
              }

              private func reload() {
                  guard !isReloading, totalAmmo > 0 else { return }
                  isReloading = true
                  canShoot    = false
                  DispatchQueue.main.asyncAfter(deadline: .now() + 1.4) { [weak self] in
                      guard let s = self else { return }
                      let load    = min(30 - s.ammo, s.totalAmmo)
                      s.ammo     += load
                      s.totalAmmo -= load
                      s.isReloading = false
                      s.canShoot    = true
                  }
              }

              private func cleanBullets() {
                  bullets = bullets.filter { $0.parent != nil }
              }

              private func updateEnemies(time: TimeInterval, dt: Float) {
                  enemies = enemies.filter { $0.parent != nil && $0.isAlive }
                  for e in enemies {
                      e.moveToward(target: playerNode.position, dt: dt)
                      let dist = e.distanceTo(playerNode.position)
                      if dist < e.kind.attackRange + 0.5 && e.canAttack(at: time) {
                          e.lastAttackTime = time
                          health -= e.kind.damage
                          DispatchQueue.main.async { [weak self] in self?.flashRed() }
                      }
                  }
              }

              private func updateWaves(dt: Float) {
                  if waveActive {
                      if enemies.filter({ $0.isAlive }).isEmpty {
                          waveActive = false
                          waveTimer  = 4.0
                          score     += 500
                          if bossSpawned { endGame(victory: true); return }
                          DispatchQueue.main.async { [weak self] in
                              guard let s = self else { return }
                              s.hudView.showMessage("WAVE CLEAR! +500", color: UIColor(red: 0.2, green: 1, blue: 0.2, alpha: 1), duration: 2.0)
                              if s.wave % 2 == 0 { s.dropAmmoBox() }
                          }
                      }
                  } else {
                      waveTimer -= Double(dt)
                      if waveTimer <= 0 { spawnWave() }
                  }
              }

              private func spawnWave() {
                  wave      += 1
                  waveActive = true
                  DispatchQueue.main.async { [weak self] in
                      guard let s = self else { return }
                      s.hudView.showMessage("⚠ WAVE \(s.wave) ⚠", color: UIColor(red: 1, green: 0.2, blue: 0.2, alpha: 1), duration: 2.0)
                  }
                  if wave == 5 { spawnBoss(); return }

                  var pool: [EnemyKind] = []
                  for _ in 0..<(3 + wave * 2) { pool.append(.walker) }
                  for _ in 0..<(wave / 2)     { pool.append(.brute) }
                  for _ in 0..<(wave / 2)     { pool.append(.runner) }
                  if wave > 3                  { pool.append(.cultist) }

                  for (i, k) in pool.enumerated() {
                      DispatchQueue.main.asyncAfter(deadline: .now() + Double(i) * 0.4) { [weak self] in
                          self?.spawnEnemy(kind: k)
                      }
                  }
              }

              private func spawnBoss() {
                  bossSpawned = true
                  DispatchQueue.main.async { [weak self] in
                      self?.hudView.showMessage("⚠ EL GIGANTE ⚠", color: UIColor(red: 1, green: 0, blue: 0, alpha: 1), duration: 3.0)
                  }
                  spawnEnemy(kind: .boss, at: SCNVector3(-(mapHalf * 0.6), 0, -(mapHalf * 0.6)))
                  for i in 0..<5 {
                      DispatchQueue.main.asyncAfter(deadline: .now() + Double(i) * 0.5) { [weak self] in
                          self?.spawnEnemy(kind: .walker)
                      }
                  }
              }

              private func spawnEnemy(kind: EnemyKind, at pos: SCNVector3? = nil) {
                  let e          = EnemyNode(kind: kind)
                  e.position     = pos ?? randomEdge()
                  e.position.y   = 0
                  scene.rootNode.addChildNode(e)
                  enemies.append(e)
              }

              private func randomEdge() -> SCNVector3 {
                  let b = mapHalf - 3
                  switch Int.random(in: 0...3) {
                  case 0:  return SCNVector3(Float.random(in: -b...b), 0, -b)
                  case 1:  return SCNVector3(Float.random(in: -b...b), 0,  b)
                  case 2:  return SCNVector3(-b, 0, Float.random(in: -b...b))
                  default: return SCNVector3( b, 0, Float.random(in: -b...b))
                  }
              }

              private func dropAmmoBox() {
                  let geo = SCNBox(width: 0.6, height: 0.6, length: 0.6, chamferRadius: 0.06)
                  let mat = SCNMaterial()
                  mat.diffuse.contents  = UIColor(red: 0.7, green: 0.5, blue: 0.15, alpha: 1)
                  mat.emission.contents = UIColor(red: 0.3, green: 0.2, blue: 0.02, alpha: 1)
                  mat.lightingModel     = .physicallyBased
                  geo.materials = [mat]
                  let node   = SCNNode(geometry: geo)
                  node.name  = "ammo"
                  node.position = SCNVector3(Float.random(in: -8...8), 0.3, Float.random(in: -8...8))
                  node.runAction(SCNAction.repeatForever(SCNAction.sequence([
                      SCNAction.moveBy(x: 0, y: 0.3, z: 0, duration: 0.8),
                      SCNAction.moveBy(x: 0, y: -0.3, z: 0, duration: 0.8)
                  ])))

                  let body = SCNPhysicsBody(type: .static, shape: nil)
                  body.categoryBitMask    = PhysicsMask.item
                  body.contactTestBitMask = PhysicsMask.player
                  body.collisionBitMask   = PhysicsMask.none
                  node.physicsBody = body
                  scene.rootNode.addChildNode(node)
                  node.runAction(SCNAction.sequence([
                      SCNAction.wait(duration: 15),
                      SCNAction.fadeOut(duration: 1),
                      SCNAction.removeFromParentNode()
                  ]))
              }

              // ⭐ Environment switching
              private func applyEnvironmentTheme(_ theme: EnvironmentTheme) {
                  scene.fogColor = theme.fogColor
                  scene.fogStartDistance = 18
                  scene.fogEndDistance = 65
                  scene.fogDensityExponent = 0.6

                  groundNode?.geometry?.firstMaterial?.diffuse.contents = theme.groundColor

                  for wall in wallNodes {
                      wall.geometry?.firstMaterial?.diffuse.contents = theme.wallColor
                  }
                  for building in buildingNodes {
                      building.geometry?.firstMaterial?.diffuse.contents = theme.buildingColor
                  }
                  for trunk in treeTrunks {
                      trunk.geometry?.firstMaterial?.diffuse.contents = theme.treeTrunkColor
                  }
                  for leaf in treeLeaves {
                      leaf.geometry?.firstMaterial?.diffuse.contents = theme.treeLeavesColor
                  }

                  moonLightNode?.light?.color = theme.directionalColor
                  ambientLightNode?.light?.color = theme.ambientColor
              }

              @objc private func cycleEnvironment() {
                  let allThemes = EnvironmentTheme.allCases
                  guard let currentIndex = allThemes.firstIndex(of: environmentTheme) else { return }
                  let nextIndex = (currentIndex + 1) % allThemes.count
                  environmentTheme = allThemes[nextIndex]
                  applyEnvironmentTheme(environmentTheme)
                  hudView.showMessage("ENVIRONMENT: \(String(describing: environmentTheme).uppercased())", color: .white, duration: 1.5)
              }

              @objc private func restartLevel() {
                  isGameOver = false
                  waveActive = false
                  bossSpawned = false
                  wave = 0
                  score = 0
                  health = maxHealth
                  ammo = 30
                  totalAmmo = 90
                  isReloading = false
                  canShoot = true
                  waveTimer = 3.0

                  for enemy in enemies { enemy.removeFromParentNode() }
                  enemies.removeAll()

                  for bullet in bullets { bullet.removeFromParentNode() }
                  bullets.removeAll()

                  scene.rootNode.childNodes.filter { $0.name == "ammo" }.forEach { $0.removeFromParentNode() }

                  playerNode.position = SCNVector3(0, 1.2, 0)
                  playerBody.eulerAngles.y = 0
                  cameraYaw = 0
                  cameraArm.eulerAngles.y = 0

                  applyEnvironmentTheme(environmentTheme)

                  hudView.showMessage("LEVEL RESTARTED", color: UIColor(red: 1, green: 0.8, blue: 0, alpha: 1), duration: 2.0)
                  DispatchQueue.main.asyncAfter(deadline: .now() + 1.0) { [weak self] in
                      self?.hudView.showMessage("WAVE 1 INCOMING!", color: UIColor(red: 1, green: 0.2, blue: 0.2, alpha: 1), duration: 2.5)
                  }
              }

              func physicsWorld(_ world: SCNPhysicsWorld, didBegin contact: SCNPhysicsContact) {
                  let nA = contact.nodeA, nB = contact.nodeB
                  let mA = nA.physicsBody?.categoryBitMask ?? 0
                  let mB = nB.physicsBody?.categoryBitMask ?? 0

                  if (mA == PhysicsMask.bullet && mB == PhysicsMask.enemy) ||
                     (mB == PhysicsMask.bullet && mA == PhysicsMask.enemy) {
                      let bNode = mA == PhysicsMask.bullet ? nA : nB
                      let eNode = (mA == PhysicsMask.enemy ? nA : nB) as? EnemyNode
                      bNode.removeFromParentNode()
                      bullets.removeAll { $0 === bNode }
                      let wasDead = !(eNode?.isAlive ?? true)
                      eNode?.takeDamage(25)
                      if let e = eNode, !wasDead, !e.isAlive {
                          let pts = e.kind.scoreValue
                          score  += pts
                          DispatchQueue.main.async { [weak self] in
                              self?.hudView.showMessage("+\(pts)", color: UIColor(red: 1, green: 0.9, blue: 0.2, alpha: 1), duration: 0.9)
                          }
                      }
                      return
                  }
                  if mA == PhysicsMask.bullet || mB == PhysicsMask.bullet {
                      let bNode = mA == PhysicsMask.bullet ? nA : nB
                      bNode.removeFromParentNode()
                      bullets.removeAll { $0 === bNode }
                      return
                  }
                  if (mA == PhysicsMask.player && mB == PhysicsMask.item) ||
                     (mB == PhysicsMask.player && mA == PhysicsMask.item) {
                      let item = mA == PhysicsMask.item ? nA : nB
                      item.removeFromParentNode()
                      totalAmmo += 30
                      DispatchQueue.main.async { [weak self] in
                          self?.hudView.showMessage("AMMO COLLECTED!", color: UIColor(red: 1, green: 0.9, blue: 0.2, alpha: 1), duration: 1.5)
                      }
                  }
              }

              private func endGame(victory: Bool) {
                  guard !isGameOver else { return }
                  isGameOver = true
                  DispatchQueue.main.asyncAfter(deadline: .now() + 1.6) { [weak self] in
                      self?.showGameOverScreen(victory: victory)
                  }
              }

              private func showGameOverScreen(victory: Bool) {
                  let ov = UIView(frame: view.bounds)
                  ov.backgroundColor = UIColor(white: 0, alpha: 0.84)
                  view.addSubview(ov)

                  func monoFont(_ sz: CGFloat, bold: Bool = true) -> UIFont {
                      let name  = bold ? "Courier-Bold" : "Courier"
                      let found = UIFont(name: name, size: sz)
                      return found ?? (bold ? UIFont.boldSystemFont(ofSize: sz) : UIFont.systemFont(ofSize: sz))
                  }

                  func lbl(_ t: String, _ sz: CGFloat, _ c: UIColor, _ y: CGFloat, bold: Bool = true) -> UILabel {
                      let l = UILabel(frame: CGRect(x: 0, y: y, width: ov.bounds.width, height: sz * 1.5))
                      l.text          = t
                      l.textColor     = c
                      l.textAlignment = .center
                      l.font          = monoFont(sz, bold: bold)
                      return l
                  }

                  let tc    = victory ? UIColor(red: 1, green: 0.82, blue: 0, alpha: 1) : UIColor(red: 0.95, green: 0, blue: 0, alpha: 1)
                  let title = lbl(victory ? "MISSION COMPLETE" : "YOU DIED", 44, tc, ov.bounds.height * 0.20)
                  title.transform = CGAffineTransform(scaleX: 0.3, y: 0.3)
                  ov.addSubview(title)
                  UIView.animate(withDuration: 0.35) { title.transform = .identity }

                  let rank: String
                  switch score {
                  case ..<1000:  rank = "D"
                  case ..<3000:  rank = "C"
                  case ..<7000:  rank = "B"
                  case ..<15000: rank = "A"
                  default:       rank = "S"
                  }
                  let rows = ["WAVES  :  \(wave)", "SCORE  :  \(score)", "RANK   :  \(rank)"]
                  for (i, s) in rows.enumerated() {
                      let l = lbl(s, 22, UIColor(white: 0.9, alpha: 1), ov.bounds.height * 0.40 + CGFloat(i) * 40, bold: false)
                      l.alpha = 0; ov.addSubview(l)
                      UIView.animate(withDuration: 0.4, delay: 0.5 + Double(i) * 0.25) { l.alpha = 1 }
                  }

                  let ag = UIButton(type: .custom)
                  ag.frame             = CGRect(x: ov.bounds.width / 2 - 120, y: ov.bounds.height * 0.63, width: 240, height: 52)
                  ag.setTitle("▶  PLAY AGAIN", for: .normal)
                  let agFont = UIFont(name: "Courier-Bold", size: 22)
                  ag.titleLabel?.font     = agFont ?? UIFont.boldSystemFont(ofSize: 22)
                  ag.backgroundColor      = UIColor(red: 0.55, green: 0, blue: 0, alpha: 0.9)
                  ag.layer.cornerRadius   = 12
                  ag.layer.borderColor    = UIColor(red: 0.9, green: 0.1, blue: 0.1, alpha: 1).cgColor
                  ag.layer.borderWidth    = 2
                  ag.alpha                = 0
                  ag.addTarget(self, action: #selector(restartGame), for: .touchUpInside)
                  ov.addSubview(ag)
                  UIView.animate(withDuration: 0.5, delay: 1.5) { ag.alpha = 1 }
              }

              @objc private func restartGame() {
                  let vc = GameViewController()
                  vc.modalPresentationStyle = .fullScreen
                  present(vc, animated: false)
              }

              private func flashRed() {
                  let f = UIView(frame: view.bounds)
                  f.backgroundColor         = UIColor(red: 0.9, green: 0, blue: 0, alpha: 0.28)
                  f.isUserInteractionEnabled = false
                  view.addSubview(f)
                  UIView.animate(withDuration: 0.25) { f.alpha = 0 } completion: { _ in f.removeFromSuperview() }
              }
          }
          SWIFT_EOF

