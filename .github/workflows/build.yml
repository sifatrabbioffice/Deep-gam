# ROAD WARRIOR - AAA Mobile Game

A fully playable 3D endless runner game with third-person perspective, on-screen joystick, character selection, and sound effects.

## How to Play
- Use the on-screen joystick to move left/right
- Collect glowing orbs for points
- Avoid falling off the road
- Change characters in Settings
- Toggle sound effects

