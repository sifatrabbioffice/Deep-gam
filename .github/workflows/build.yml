- 👥 6 playable characters
- 🌟 Endless procedurally generated road
- 🎵 Sound effects
- ⚙️ Settings menu
- 📱 Mobile-optimized touch controls

## Play Now
Visit: https://[your-github-username].github.io/[repo-name]/
